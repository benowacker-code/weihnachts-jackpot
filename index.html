/* Preisnamen einpassen: erst einzeilig verkleinern (bis 18 px), sonst zweizeilig; ein einzelnes zu langes Wort
   bekommt einen Trennstrich – bevorzugt an einer Wortfuge („Lebkuchen-/herz“, solange das nicht kleiner als JOINT_MIN px
   wird), sonst an einer Silbengrenze. So läuft nichts über die Plakette hinaus.
   aw.dataset.fs = erreichte Schriftgröße. Der Admin warnt unter AW_SMALL px und bei zweizeiligen Namen: auf einem
   43″-Fernseher aus 5 m ist 19 px gerade so lesbar (Versalhöhe ≈ 5,6 Bogenminuten), alles darunter nicht mehr sicher. */
const AW_SMALL=19,JOINT_MIN=16;
function fitAward(){
  document.querySelectorAll('.aw-pr').forEach(el=>{
    const sp=el.firstElementChild,aw=el.parentElement;if(!sp)return;
    const text=el.dataset.t||sp.textContent;
    aw.classList.remove('two');el.style.fontSize='';sp.textContent=text;
    const cs=getComputedStyle(el),max=el.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
    let fs=parseFloat(cs.fontSize)||28;aw.dataset.fs=fs;
    while(sp.offsetWidth>max&&fs>18){fs-=1;el.style.fontSize=fs+'px';aw.dataset.fs=fs;}
    if(sp.offsetWidth<=max)return;
    aw.classList.add('two');el.style.fontSize='';
    const top=Math.min(19,parseFloat(getComputedStyle(el).fontSize)||19);
    for(const [joints,lo] of [[true,JOINT_MIN],[false,12]])
      for(fs=top;fs>=lo;fs--){
        el.style.fontSize=fs+'px';aw.dataset.fs=fs;const L=breakLines(sp,text,max,joints);
        if(L){sp.innerHTML=L.map(esc).join('<br>');return;}}
    sp.textContent=text;
  });
}
/* Preise, deren Name auf dem Gewinnplan kleiner als AW_SMALL px oder zweizeilig gesetzt ist (für den Hinweis im Admin) */
const awardSmall=()=>[...document.querySelectorAll('#awRow .aw')].filter(a=>+a.dataset.fs<AW_SMALL).map(a=>+a.dataset.sym);   // zweizeilig ist in Ordnung, solange die Schrift ≥ AW_SMALL bleibt
/* Wortfugen: übliche Endglieder zusammengesetzter Preisnamen („Lebkuchen|herz“, „Schokoweihnachts|mann“, „Glühwein|gutschein“) */
const JOINT_TAILS=['herz','herzen','mann','männer','stern','sterne','kugel','kugeln','stange','stangen','kuchen','keks','kekse','plätzchen','tüte','tüten',
  'schokolade','gutschein','becher','punsch','waffel','waffeln','apfel','äpfel','mandeln','nüsse','bonbon','bonbons','geschenk','geschenke','los','lose',
  'preis','wein','saft','brezel','tafel','riegel','tasse','karte','spiel','kakao','kaffee','tee','glück','überraschung','paket','beutel','sack','zucker'];
function jointsAt(w){const lw=w.toLowerCase(),out=[];
  for(const t of JOINT_TAILS){const k=w.length-t.length;if(k>=3&&lw.endsWith(t)&&!out.includes(k))out.push(k);}
  return out.sort((a,b)=>b-a);}
/* Trennstellen eines Wortes (absteigend), einfache deutsche Regel: vor dem letzten Mitlaut vor einem Selbstlaut;
   ch, ck, sch, ph, th bleiben zusammen („Leb-ku-chen-herz“, „Über-ra-schung“). Mindestens 3 Zeichen je Teil. */
function hyphenAt(w){
  const V=/[aeiouyäöüAEIOUYÄÖÜ]/,out=[];
  for(let j=w.length-1;j>=3;j--){
    if(!V.test(w[j])||V.test(w[j-1]))continue;
    let a=j-1;while(a>0&&!V.test(w[a-1])&&/[a-zß]/i.test(w[a-1]))a--;   // Anfang der Mitlautgruppe
    if(a===0)continue;
    const g=w.slice(a,j).toLowerCase();
    const k=g.endsWith('sch')?j-3:/(ch|ck|ph|th)$/.test(g)?j-2:j-1;
    if(k>=Math.max(3,a)&&w.length-k>=3)out.push(k);
  }
  return out;
}
function breakLines(sp,text,max,joints){   // höchstens zwei Zeilen, sonst null; joints: Wörter nur an Wortfugen trennen
  const fits=s=>{sp.textContent=s;return sp.offsetWidth<=max;};
  const lines=[];let cur='';
  for(let w of text.split(' ')){
    while(w){
      const cand=cur?cur+' '+w:w;
      if(fits(cand)){cur=cand;break;}
      if(cur){lines.push(cur);cur='';continue;}
      let j=w.lastIndexOf('-',w.length-2);while(j>1&&!fits(w.slice(0,j+1)))j=w.lastIndexOf('-',j-1);   // vorhandener Bindestrich zuerst
      if(j>1){lines.push(w.slice(0,j+1));w=w.slice(j+1);continue;}
      let k=(joints?jointsAt(w):hyphenAt(w)).find(k=>fits(w.slice(0,k)+'-'));   // Wortfuge bzw. Silbengrenze, sonst an der breitesten Stelle
      if(k==null&&joints)return null;
      if(k==null){k=w.length-2;while(k>=3&&!fits(w.slice(0,k)+'-'))k--;}
      if(k<3)return null;
      lines.push(w.slice(0,k)+'-');w=w.slice(k);
    }
  }
  if(cur)lines.push(cur);
  return lines.length<=2?lines:null;
}

/* ================= Walzen ================= */
const CELL=136,TAPE=48;
class Reel{
  constructor(el){this.el=el;this.tape=Array.from({length:TAPE},filler);this.pos=TAPE*4+(rand()*TAPE|0);this.fast=false;this.cells=[];
    for(let k=0;k<5;k++){const c=document.createElement('div');c.className='cell';const im=document.createElement('img');im.alt='';im.draggable=false;
      const g=document.createElement('i');g.className='glint';c.append(im,g);el.appendChild(c);this.cells.push({c,im,sym:-1,blur:null});}}
  render(){const base=Math.floor(this.pos),frac=this.pos-base;
    this.cells.forEach((cell,k)=>{const sym=this.tape[mod(base-k+1,TAPE)];
      if(sym!==cell.sym||this.fast!==cell.blur){cell.im.src=symImg(sym,this.fast);cell.sym=sym;cell.blur=this.fast;}
      cell.c.style.transform=`translate3d(0,${f2((frac+k-1)*CELL)}px,0)`;});}
  row(r){return this.cells[r+1];}
  set(rows,i){const p=Math.round(this.pos);this.pos=p;this.tape[mod(p,TAPE)]=rows[0][i];this.tape[mod(p-1,TAPE)]=rows[1][i];this.tape[mod(p-2,TAPE)]=rows[2][i];this.render();}
  shown(){const p=Math.round(this.pos);return[this.tape[mod(p,TAPE)],this.tape[mod(p-1,TAPE)],this.tape[mod(p-2,TAPE)]];}
}
let reels=[];
/* nach Änderung der Gewinnsymbole: Plakette ja/nein neu zeichnen; das Band außerhalb des sichtbaren Fensters neu mischen,
   damit neue Gewinnsymbole beim Drehen vorbeilaufen und entfernte Zusatzsymbole verschwinden */
function refreshReels(){reels.forEach(r=>{const b=Math.floor(r.pos),keep=new Set([-3,-2,-1,0,1].map(d=>mod(b+d,TAPE)));
  for(let k=0;k<TAPE;k++)if(!keep.has(k))r.tape[k]=filler();
  r.cells.forEach(c=>{c.sym=-1;});r.render();});}
function initReels(){reels=[...document.querySelectorAll('.reel')].map(el=>new Reel(el));const start=makeRows(null);reels.forEach((r,i)=>r.set(start,i));}
const easeOutBack=t=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function spinReels(result){
  return new Promise(resolve=>{
    const t0=performance.now(),wind=reduce?0:160;let lastTick=0,stopped=0,teased=false,looping=false;
    // „Dritte Walze läuft länger“ nur als Folge des zufälligen Bildes (zwei Gleiche vorn), nie gezielt erzeugt
    const tease=!reduce&&result.rows[1][0]===result.rows[1][1];
    const plans=reels.map((rl,i)=>{
      const start=Math.round(rl.pos);let dist=reduce?6:24+i*8,dur=reduce?260:1250+i*460;
      if(tease&&i===2){dist+=12;dur+=1000;}
      const target=start+dist;
      rl.tape[mod(target,TAPE)]=result.rows[0][i];rl.tape[mod(target-1,TAPE)]=result.rows[1][i];rl.tape[mod(target-2,TAPE)]=result.rows[2][i];
      return{rl,start,target,dur,done:false,prev:start,pt:t0};
    });
    function frame(now){
      const el=Math.max(0,now-t0);
      if(!looping&&el>wind*.6){looping=true;loopStart();}
      plans.forEach(p=>{
        if(p.done)return;let pos;
        if(wind>0&&el<wind){pos=p.start-.3*Math.sin(el/wind*Math.PI/2);}
        else{const t=Math.min(1,(el-wind)/p.dur);pos=(p.start-.3)+(p.target-(p.start-.3))*easeOutBack(t);if(t>=1){pos=p.target;p.done=true;}}
        const dt=Math.max(1,now-p.pt)/1000,v=Math.abs(pos-p.prev)/dt;p.prev=pos;p.pt=now;
        const fast=!p.done&&v>9;if(fast!==p.rl.fast){p.rl.fast=fast;p.rl.el.classList.toggle('fast',fast);}
        p.rl.pos=pos;p.rl.render();
        if(p.done){p.rl.el.classList.remove('bump');void p.rl.el.offsetWidth;p.rl.el.classList.add('bump');play('stop');stopped++;
          if(stopped===1)loopLevel(.7);
          if(stopped===2){loopLevel(tease?.55:.4);if(tease&&!teased){teased=true;setLights('tease');}}
          if(stopped===3){loopStop(.08);resolve();}}
      });
      if(A.bad.spin&&now-lastTick>70&&plans.some(p=>!p.done)&&el>wind){play('spin');lastTick=now;}
      if(stopped<3)requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ================= Hebel: im Schacht der Frontplatte, Nabe eingelassen =================
   Zustand p: 0 = Ruhelage oben, 1 = Endanschlag. Antippen dreht nicht – erst ab 60 % Zug wird gedreht. */
const LV={px:1038,py:606,top:260,travel:198,smax:.32,w:19};
const TOPY=LV.top,TRAVEL=LV.travel;
let knob,arm,collar;
function proj(p){return{x:LV.px,y:LV.top+p*LV.travel,s:1+LV.smax*p};}
let levP=0;
function quad(x0,y0,x1,y1,w0,w1){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  return `${f2(x0+nx*w0)},${f2(y0+ny*w0)} ${f2(x1+nx*w1)},${f2(y1+ny*w1)} ${f2(x1-nx*w1)},${f2(y1-ny*w1)} ${f2(x0-nx*w0)},${f2(y0-ny*w0)}`;}
function setLever(p){
  levP=p;const k=proj(p);
  arm.setAttribute('points',quad(LV.px,LV.py,k.x,k.y,LV.w/2,LV.w*k.s/2));
  const at=u=>LV.py+(k.y-LV.py)*u,sm=1+(k.s-1)*.8;
  collar.setAttribute('points',quad(k.x,at(.74),k.x,at(.86),LV.w*.74*sm,LV.w*.74*sm));
  const e=k.s-1;
  knob.style.transform=`translate3d(${f2(k.x)}px,${f2(k.y)}px,0) scale(${f2(k.s)})`;
  knob.style.boxShadow=`0 0 0 2px #221915,0 ${f2(7+22*e)}px ${f2(14+44*e)}px rgba(0,0,0,${f2(.42+.25*e)})`;
}
const slotLamps=[];const LAMP_N=6;let lampRush=0;
function placeSlotLamps(){
  const box=$('slotLamps');box.innerHTML='';slotLamps.length=0;
  for(let i=0;i<LAMP_N;i++){const y=f2(TOPY+66+i*(TRAVEL-26)/(LAMP_N-1));const p=(y-TOPY)/TRAVEL;
    for(const dx of[-41,41]){const el=document.createElement('i');el.className='lamp-s';el.style.left=(CXR+dx)+'px';el.style.top=y+'px';box.appendChild(el);slotLamps.push({el,p,i});}}
}
function lampTick(){
  const t=performance.now();
  slotLamps.forEach(l=>{let on;
    if(drag){if(levP>=.6)on=true;else{const ph=Math.floor(t/80)%(LAMP_N+1);on=l.p>levP&&(l.i===ph||l.i===ph-1);}}
    else if(leverAnim&&busy)on=levP>=.6;
    else if(t<lampRush){on=reduce?true:(()=>{const ph=Math.floor(t/60)%(LAMP_N+1);return l.i===ph||l.i===ph-1;})();}
    else if(body.classList.contains('ready')&&!reduce){const ph=Math.floor(t/140)%(LAMP_N+6);on=l.i===ph||l.i===ph-1;}
    else on=false;
    if(l.el._on!==on){l.el._on=on;l.el.classList.toggle('on',on);}});
}
function layoutLever(){
  LV.px=CXR;const sv=$('leverSvg');sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.setAttribute('width',W);sv.setAttribute('height',H);
  $('hub').innerHTML=`<circle cx="${CXR}" cy="${LV.py}" r="40" fill="#1a0a08" opacity=".35" transform="translate(0 4)"/>
    <circle cx="${CXR}" cy="${LV.py}" r="38" fill="url(#hubG)" stroke="#221915" stroke-width="2"/>
    <circle cx="${CXR}" cy="${LV.py}" r="29" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>
    <circle cx="${CXR}" cy="${LV.py}" r="16" fill="url(#capG)" stroke="#221915" stroke-width="1.8"/>
    <path d="M${CXR-6} ${LV.py-8}q4-3 9-1" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>`;
  placeSlotLamps();setLever(levP);
}
let leverAnim=0,drag=null,lastInteract=performance.now();
function stopLeverAnim(){cancelAnimationFrame(leverAnim);leverAnim=0;}
function springBack(){ // zurückfedern; harter Anschlag in der Ruhelage, kleiner Rückprall nach unten
  stopLeverAnim();let p=levP,v=0,last=performance.now();
  if(reduce){setLever(0);return;}
  const k=150,c=5,e=.16;
  const step=now=>{const dt=Math.min(.033,(now-last)/1000);last=now;
    for(let i=0;i<4;i++){const h=dt/4;v+=(-k*p-c*v)*h;p+=v*h;if(p<0){p=0;if(v<0){if(v<-2.5)play('tap',{gain:.5,rate:.8});v=-v*e;}}}
    setLever(p);
    if(p<.002&&Math.abs(v)<.05){setLever(0);leverAnim=0;return;}
    leverAnim=requestAnimationFrame(step);};
  leverAnim=requestAnimationFrame(step);
}
function dip(depth,dur,then){
  stopLeverAnim();if(reduce){if(then)then();return;}
  const t0=performance.now(),p0=levP;
  const step=now=>{if(drag){leverAnim=0;return;}const t=Math.min(1,(now-t0)/dur);setLever(p0+(depth-p0)*(1-(1-t)*(1-t)));
    if(t<1)leverAnim=requestAnimationFrame(step);else{leverAnim=0;if(then)then();}};
  leverAnim=requestAnimationFrame(step);
}
function autoPull(){ // Ersatzknopf / Leertaste: Hebel zieht sichtbar mit
  if(!canPlay()||drag)return;
  if(reduce){play('lever');startSpin();return;}
  stopLeverAnim();const t0=performance.now(),p0=levP,dur=300;play('lever');
  const step=now=>{const t=Math.min(1,(now-t0)/dur);setLever(p0+(1-p0)*t*t);
    if(t<1)leverAnim=requestAnimationFrame(step);else{startSpin();springBack();}};
  leverAnim=requestAnimationFrame(step);
}
function pullHint(){
  play('tap');lampRush=performance.now()+1000;
  msgHold=true;clearTimeout(msgTimer);setMsg('Ganz nach unten ziehen!');
  msgTimer=setTimeout(()=>{msgHold=false;if(!busy&&!winOpen)update();},2500);
}
const stageY=e=>(e.clientY-stage.getBoundingClientRect().top)/scale;
function initLever(){
  knob=$('knob');arm=$('arm');collar=$('collar');
  knob.addEventListener('pointerdown',e=>{
    e.preventDefault();poke();
    if(!canPlay()){if(!busy&&!winOpen&&!paused){knob.classList.remove('nope');void knob.offsetWidth;knob.classList.add('nope');play('tap',{gain:.7,rate:.6});}return;}
    keepAwake();stopLeverAnim();
    try{knob.setPointerCapture(e.pointerId);}catch(_){}
    drag={id:e.pointerId,y0:stageY(e),p0:levP,p:levP,notch:Math.floor(levP*10)};
    knob.classList.add('grab');body.classList.add('pulling');
  });
  knob.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const p=clamp(drag.p0+(stageY(e)-drag.y0)/TRAVEL,0,1);drag.p=p;setLever(p);
    const notch=Math.floor(p*10);if(notch>drag.notch)play('tap',{gain:.28,rate:1.7});drag.notch=notch;
  });
  const release=e=>{
    if(!drag||(e&&e.pointerId!==drag.id))return;
    const p=drag.p;drag=null;knob.classList.remove('grab');body.classList.remove('pulling');poke();
    if(p>=.6&&canPlay()){play('lever');startSpin();springBack();return;}
    if(canPlay())pullHint();
    if(p<.12)dip(.12,110,springBack);else springBack();
  };
  knob.addEventListener('pointerup',release);knob.addEventListener('pointercancel',release);knob.addEventListener('lostpointercapture',release);
  knob.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();autoPull();}});
  // Lockreiz, solange niemand spielt: Knauf taucht kurz nach unten (Zugrichtung), Lämpchen laufen schnell nach unten
  setInterval(()=>{
    if(reduce||!canPlay()||drag||leverAnim||performance.now()-lastInteract<4000)return;
    lampRush=performance.now()+900;
    const t0=performance.now();const step=now=>{const t=(now-t0)/700;if(t>=1||drag){if(!drag)setLever(0);leverAnim=0;return;}
      setLever(.08*Math.sin(t*Math.PI));leverAnim=requestAnimationFrame(step);};leverAnim=requestAnimationFrame(step);
  },5200);
}

/* ================= Konfetti (Papier, Farbsystem) ================= */
let fx,fc;const DPR=Math.min(2,window.devicePixelRatio||1);
function sizeFx(){if(!fx){fx=$('fx');fc=fx.getContext('2d');}fx.width=W*DPR;fx.height=H*DPR;fx.style.width=W+'px';fc.setTransform(DPR,0,0,DPR,0,0);}
let parts=[],fxOn=false;const CCOL=['#a92e31','#f3e6c8','#cf9d45','#2e6a4a','#fffaf0','#a92e31','#d7dcdf'];
function confetti(n,x0,x1,y0,spread=140){if(reduce)return;
  for(let i=0;i<n;i++)parts.push({x:x0+rnd()*(x1-x0),y:y0-rnd()*spread,vx:(rnd()-.5)*1.4,vy:.8+rnd()*2.2,w:6+rnd()*6,h:9+rnd()*8,rot:rnd()*6.28,vr:(rnd()-.5)*.12,fl:rnd()*6.28,vf:.07+rnd()*.13,c:CCOL[rnd()*CCOL.length|0]});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){fc.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.y<H+20);
  for(const p of parts){p.vy=Math.min(p.vy+.04,3.1);p.fl+=p.vf;p.vx+=Math.sin(p.fl)*.05;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    const c=Math.cos(p.fl);fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.scale(1,c);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    if(c<0){fc.fillStyle='rgba(34,25,21,.18)';fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);}fc.restore();}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fc.clearRect(0,0,W,H);}}

/* Bildschirm wach halten (zusätzlich zu „Automatische Sperre: Nie“): beim ersten Tippen, beim Spielen und nach der Rückkehr in die App */
let wakeLock=null,wakeReq=false;
async function keepAwake(){
  if(wakeLock||wakeReq||document.hidden||!navigator.wakeLock)return;wakeReq=true;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(_){}

/* ================= Vollbild (Fullscreen-API) =================
   Einstellung „Vollbild: beim ersten Tippen“ (Standard): Das Loslassen eines Fingers (bzw. eine Taste) fordert das Vollbild an,
   solange es nicht aktiv ist – nur auf dem Spielbildschirm, nicht bei offenem PIN-Feld oder Admin (Zustand NACH dem Tipp, also
   zählt der Tipp auf ✕ bzw. „Schließen“ schon wieder). Der Tipp wirkt ganz normal
   weiter; verworfen wird nur der nachgeschobene „click“ (die Seite ändert sich gerade unter dem Finger). Lehnt das iPad ab,
   wird es frühestens nach 10 s erneut versucht; gibt es die Funktion nicht, passiert nichts (Admin → Infos zeigt es an).
   Beim Öffnen des PIN-Felds wird das Vollbild verlassen: iPadOS hält sonst bei schnellem Tippen im Vollbild die Seite an und
   warnt „It looks like you are typing while in full screen“; Textfelder im Admin beenden es ohnehin. Der nächste Tipp danach
   holt es zurück. Die Gehäuse-Abdeckung oben (topCap) bleibt dabei gleich – die Maschine springt nicht. */
const FS={last:'noch nicht versucht',tries:0,ok:0,changes:0,pend:false,retryAt:0,limit:0};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
function fsAvail(){const el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen)&&(document.fullscreenEnabled===true||document.webkitFullscreenEnabled===true);}
function fsRequest(){   // muss aus einer Bedienung heraus aufgerufen werden
  if(FS.pend||fsEl())return false;
  if(!fsAvail()){FS.last='nicht verfügbar';return false;}
  const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
  FS.pend=true;FS.tries++;FS.last='angefordert …';
  // ok nur, wenn das Vollbild wirklich aktiv ist; sonst (abgelehnt, „erfüllt“ ohne Wirkung, keine Antwort) frühestens nach 10 s erneut
  const done=(ok,t)=>{if(!FS.pend)return;FS.pend=false;clearTimeout(FS.limit);FS.last=t;if(ok)FS.ok++;else FS.retryAt=performance.now()+10000;};
  const check=t=>{if(fsEl())return done(true,'ok');setTimeout(()=>done(!!fsEl(),fsEl()?'ok':t),500);};
  FS.limit=setTimeout(()=>done(!!fsEl(),fsEl()?'ok':'keine Antwort'),3000);   // hängt das Versprechen, nicht für immer „angefordert …“
  try{const p=rq.call(el,{navigationUI:'hide'});
    if(p&&typeof p.then==='function')p.then(()=>check('keine Wirkung'),e=>done(false,'abgelehnt ('+((e&&e.name)||'Fehler')+')'));
    else setTimeout(()=>check('keine Reaktion'),300);}
  catch(e){done(false,'Fehler ('+((e&&e.name)||e)+')');}
  return true;
}
function fsExit(){
  if(!fsEl())return;const ex=document.exitFullscreen||document.webkitExitFullscreen;
  try{const p=ex&&ex.call(document);if(p&&p.catch)p.catch(()=>{});}catch(_){}
}
function fsAuto(e){
  if(S.fullscreen!=='tippen'||fsEl()||FS.pend||PIN.mode||adminOpen||document.hidden||performance.now()<FS.retryAt)return;
  if(e.type==='keydown'&&(e.key==='Escape'||e.repeat))return;
  if(e.type==='pointerup'&&e.pointerType==='touch'&&'ontouchend' in window)return;   // Finger: über touchend (dort sicher als Bedienung gewertet)
  if(fsRequest()&&e.type!=='keydown')swallowClick();
}
function initFullscreen(){
  // Blase-Phase am Fenster: läuft NACH den Knopf-Handlern – für Finger (touchend) und Maus/Taste gleich. Der Tipp, der das
  // PIN-Feld (✕) oder den Admin (Schließen) schließt, holt das Vollbild also schon zurück; der Tipp, der das PIN-Feld öffnet, nicht.
  ['touchend','pointerup','keydown'].forEach(t=>addEventListener(t,fsAuto,{passive:true}));
  ['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,()=>{FS.changes++;setTimeout(fit,60);
    if(adminOpen&&adTab==='einstellungen')setTimeout(()=>{if(adminOpen&&adTab==='einstellungen')rerender();},80);}));   // Knopf „Jetzt testen“/„Vollbild beenden“
}

async function startSpin(){

  creditHold=0;freeTok++;              // noch nicht gezeigtes Freispiel sofort zeigen (falls direkt weitergespielt wird)

    const add=Math.max(0,Math.min(S.freeN,99-G.credits));free=add;if(add){G.credits+=add;creditHold=add;}ST.wins[FREE]++;}
  else if(result.sym>=0){const p=S.prizes[result.sym];G.voucher++;
    p.n=Math.max(0,p.n-1);autoP();saveSettings();stockChanged=true;   // Bestand der Gruppe: ein Stück weniger, Chancen neu
    w={no:G.voucher,t:Date.now(),sym:result.sym,name:p.name,value:p.value,tier:p.tier};
    G.pending=w;ST.wins[result.sym]++;ST.vals[result.sym]=Math.round((ST.vals[result.sym]+p.value)*100)/100;
    ST.valueOut=Math.round((ST.valueOut+p.value)*100)/100;ST.log.unshift(w);if(ST.log.length>50)ST.log.length=50;}

/* Hauptgewinn: Weihnachtsmann fliegt im Schlitten von rechts nach links über den oberen Teil der Maschine (steigt dabei leicht),
   mit Goldfunken-Spur. Liegt über Abdunklung und Gutschein (z-index 45), fängt keine Berührungen ab. Ohne Bewegung (reduce): aus. */
const SLEIGH_MS=4000,SLEIGH_W=460,SLEIGH_H=147;
let sleighEl=null,sleighRaf=0;
function sleighRide(){
  if(reduce)return;
  if(!sleighEl){sleighEl=document.createElement('div');sleighEl.id='sleigh';sleighEl.setAttribute('aria-hidden','true');
    sleighEl.innerHTML=`<svg width="${SLEIGH_W}" height="${SLEIGH_H}" viewBox="-6 -10 416 133">${DEFS}<g stroke-linejoin="round" stroke-linecap="round">${sleighArt()}</g></svg>`;
    stage.appendChild(sleighEl);}
  cancelAnimationFrame(sleighRaf);sleighEl.hidden=false;
  const t0=performance.now(),x0=W+30,x1=-SLEIGH_W-60;let lastSp=0;
  const step=now=>{
    const k=Math.min(1,(now-t0)/SLEIGH_MS),x=x0+(x1-x0)*k,y=110-104*k+Math.sin(k*Math.PI*5)*7,rot=-4+Math.cos(k*Math.PI*5)*1.6;
    sleighEl.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
    if(now-lastSp>40&&k<.97){lastSp=now;sparkle(x+SLEIGH_W-8+rnd()*18,y+SLEIGH_H-18+rnd()*12);}
    if(k<1)sleighRaf=requestAnimationFrame(step);else sleighEl.hidden=true;};
  sleighRaf=requestAnimationFrame(step);
}
function sparkle(x,y){
  const s=document.createElement('i');s.className='spark';s.style.left=x.toFixed(1)+'px';s.style.top=y.toFixed(1)+'px';
  s.style.setProperty('--sz',(7+rnd()*9).toFixed(1)+'px');stage.appendChild(s);setTimeout(()=>s.remove(),1000);

/* ================= Verstecktes Auslösen: 1 s auf eines der beiden Logo-Medaillons (links/rechts vom Schriftzug) =================
   Rückmeldung am Medaillon (der Fernseher zeigt sie mit, aber nie Zahlen oder eine Sperrdauer):
   – sofort beim Aufsetzen drückt es sich leicht ein (wie ein Knopf) – mehr sieht ein Spieler beim kurzen Antippen nicht;
   – ab 0,25 s füllt sich der Messingring der Fassung, bei 1,0 s ist er voll: kurzer Klick, PIN-Feld geht auf;
   – gesperrt (Walzen drehen, Gewinnkarte offen, Code-Sperre): nach 0,25 s schüttelt es kurz den Kopf, kein Ring. Bleibt der
     Finger liegen, wird alle 0,1 s nachgesehen: Sobald es frei ist (z. B. Walzen stehen), beginnt der Ring von vorn.
   Loslassen, Wegziehen (> 30 px), Abbruch durch das System (pointercancel) oder App im Hintergrund: Ring weg, nichts passiert.
   Stiller Ersatz ohne jede Rückmeldung: die Schraube oben links (gleiche Haltezeit). Während einer Code-Sperre öffnet nur sie
   das PIN-Feld – im Modus „unlock“, der nur die Admin-PIN annimmt (siehe pinSubmit). */
let rf=null;
const RF_MS=1000,RF_RING=250,RF_SLOP=30;   // Haltezeit, Beginn des Rings, so weit (CSS-px) darf der Finger wandern
const codeLocked=()=>Date.now()<G.lockUntil;
/* side 'L'/'R' = Logo, '' = Schraube. Die Schraube ist bei Code-Sperre nicht gesperrt (Team-Ausweg), nur wenn auch ihr eigener
   Weg gerade gesperrt ist (3 falsche Admin-PINs dort → 1 min). */
const rfBlocked=(side='L')=>busy||paused||(side?winOpen||codeLocked():codeLocked()?Date.now()<G.aLockUntil:winOpen);
const medalEl=s=>s?document.querySelector(`#medals .md[data-s="${s}"]`):null;
function ringSet(s,k){   // Füllstand 0…1 des Messingrings (0 = unsichtbar)
  const m=medalEl(s);if(!m)return;const g=m.querySelector('.mdr');if(!g)return;
  g.style.opacity=k>0?'1':'0';const off=String(f2(MED.rc*(1-clamp(k,0,1))));
  g.querySelectorAll('circle').forEach(c=>c.setAttribute('stroke-dashoffset',off));
}
function medalNope(s){const m=medalEl(s);if(!m)return;m.classList.remove('nope');void m.getBoundingClientRect();m.classList.add('nope');
  clearTimeout(m._nt);m._nt=setTimeout(()=>m.classList.remove('nope'),460);play('tap',{gain:.6,rate:.6});}
function rfStop(r){clearTimeout(r.t1);clearTimeout(r.t2);clearInterval(r.poll);cancelAnimationFrame(r.raf);}
function rfEnd(){
  if(!rf)return;const r=rf;rf=null;rfStop(r);
  const m=medalEl(r.side);if(m)m.classList.remove('press');ringSet(r.side,0);
}
function rfRing(){   // Ring von 0,25 s bis 1,0 s füllen (Fortschritt aus der Zeit seit dem Aufsetzen bzw. seit „wieder frei“)
  if(!rf||rf.wait)return;const k=(performance.now()-rf.t0-RF_RING)/(RF_MS-RF_RING);
  ringSet(rf.side,k);if(k<1)rf.raf=requestAnimationFrame(rfRing);
}
/* Haltezeit (neu) beginnen: Ring ab 0,25 s, Auslösen bei 1,0 s */
function rfArm(r){
  r.wait=false;r.t0=performance.now();
  r.t1=setTimeout(()=>{if(rf!==r)return;if(rfBlocked(r.side))return rfWait(r);if(r.side)rfRing();},RF_RING);
  r.t2=setTimeout(()=>rfFire(r),RF_MS);
}
/* Gesperrt, Finger liegt noch: einmal Kopfschütteln (Medaillon bleibt eingedrückt), dann warten, bis es frei ist */
function rfWait(r){
  rfStop(r);r.wait=true;ringSet(r.side,0);if(r.side)medalNope(r.side);
  r.poll=setInterval(()=>{if(rf!==r){clearInterval(r.poll);return;}if(!rfBlocked(r.side)){clearInterval(r.poll);rfArm(r);}},100);
}
function rfFire(r){
  if(rf!==r||r.wait)return;
  if(rfBlocked(r.side))return rfWait(r);   // inzwischen gesperrt (z. B. Hebel gezogen)
  const unlock=!r.side&&codeLocked();   // Schraube während der Code-Sperre: nur Admin-PIN
  ringSet(r.side,1);rfEnd();play('tap',{gain:.85,rate:1.2});swallowClick();openPin(unlock?'unlock':'release');
}
function initRefill(){
  [['logoL','L'],['logoR','R'],['refill','']].forEach(([id,side])=>{
    const el=$(id);if(!el)return;
    // iOS: ohne das kann ein langes Halten als Systemgeste (Lupe, Vorschau) enden und pointercancel schicken – dann wirkte es,
    // als würde das Logo „nicht erkennen“. Pointer-Ereignisse laufen trotzdem; der „click“ danach entfällt (wird ohnehin verworfen).
    el.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
    el.addEventListener('pointerdown',e=>{
      e.preventDefault();if(rf||paused)return;   // ein Finger genügt; ein zweiter wird ignoriert
      try{el.setPointerCapture(e.pointerId);}catch(_){}
      const m=medalEl(side);if(m)m.classList.add('press');
      rf={id:e.pointerId,el,side,x:e.clientX,y:e.clientY,t0:0,wait:false,raf:0,t1:0,t2:0,poll:0};
      rfArm(rf);
    });
    el.addEventListener('pointermove',e=>{if(rf&&rf.el===el&&e.pointerId===rf.id&&Math.hypot(e.clientX-rf.x,e.clientY-rf.y)>RF_SLOP)rfEnd();});
    const end=e=>{if(rf&&rf.el===el&&e.pointerId===rf.id)rfEnd();};
    ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,end));
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)rfEnd();});
}
/* Restzeit der Code-Sperre als Text („42 s“, „5 min“) */
function lockLeft(){const ms=Math.max(0,G.lockUntil-Date.now());return ms<=60000?`${Math.max(1,Math.ceil(ms/1000))} s`:`${Math.ceil(ms/60000)} min`;}

/* ================= PIN-Feld =================
   Auf dem Fernseher sichtbar: nur Punkte. Keine Taste leuchtet oder bewegt sich – die Rückmeldung ist für jede Taste gleich:
   gleicher Klick, das ganze Feld pulsiert kurz messingfarben, der jeweils neue Punkt ploppt auf.
   Kein Tipp geht verloren: Tasten reagieren schon beim Aufsetzen (auch mehrere Finger), ein Tipp in die Fuge zählt für die
   nächste Taste, und was während der kurzen Prüfung nach der 4. Ziffer getippt wird, kommt danach dran.
   Modi: release (Freigabe; Admin-PIN öffnet Admin), confirm (Gewinn bestätigen), newpin (PIN ändern),
   unlock (Schraube während der Code-Sperre: nur die Admin-PIN; sieht aus wie „Code“, verrät also nichts). */
const PIN={mode:'',buf:'',timer:0,closeT:0,added:0,step:0,first:'',target:'',onDone:null,locked:false,checking:false,q:[]};
function pinTitle(){
  if(PIN.mode==='newpin')return PIN.step<0?'Aktuelle Admin-PIN':PIN.step?'Wiederholen':(PIN.target==='admin'?'Neue Admin-PIN':'Neue Freigabe-PIN');
  return PIN.mode==='confirm'?'Gewinn bestätigen':'Code';
}
/* opt.verify: vor dem Ändern erst die aktuelle Admin-PIN abfragen (falls der Admin-Bereich offen herumsteht) */
function openPin(mode,opt={}){
  rfEnd();swallowClick();fsExit();   // fsExit: Vollbild verlassen (iPadOS-Warnung beim Tippen im Vollbild, siehe Vollbild)
  Object.assign(PIN,{mode,buf:'',added:0,step:opt.verify?-1:0,first:'',target:opt.target||'',onDone:opt.onDone||null,locked:false,checking:false,q:[]});
  $('pinT').textContent=pinTitle();pinStatus('');renderDots();
  $('pin').hidden=false;paused=true;update();pinArm();
}
function closePin(){
  if(!PIN.mode)return;
  clearTimeout(PIN.timer);clearTimeout(PIN.closeT);$('pin').hidden=true;swallowClick();   // Finger liegt evtl. noch auf: kein Klick auf das, was darunter erscheint
  const added=PIN.added;PIN.mode='';PIN.buf='';PIN.q=[];PIN.checking=false;
  paused=adminOpen;update();poke();
  if(added>0)toast(`+${added} ${gamesWord(added)}`);
}
function pinArm(){clearTimeout(PIN.timer);PIN.timer=setTimeout(closePin,20000);}   // 20 s ohne Eingabe → zu
/* Kurze Rückmeldungen per requestAnimationFrame statt CSS-Animation: danach ist das Feld wieder pixelgleich (eine
   CSS-Animation lässt in Chrome/Safari eine Compositing-Ebene zurück, die Kanten minimal anders glättet). */
function tween(el,ms,fn){cancelAnimationFrame(el._tw);const t0=performance.now();
  const st=now=>{const k=Math.min(1,(now-t0)/ms);fn(k);el._tw=k<1?requestAnimationFrame(st):0;};fn(0);el._tw=requestAnimationFrame(st);}
function pinPulse(){   // ganzes Feld: Messing-Rand und warmes Licht, 0,22 s abklingend (für jede Taste gleich)
  const el=$('pinIn');el.classList.add('pulse');
  tween(el,220,k=>{if(k>=1){el.style.boxShadow='';el.classList.remove('pulse');return;}const a=1-k;
    el.style.boxShadow=`inset 0 0 0 1.5px var(--tinte),inset 0 0 0 5px rgba(200,146,46,${f2(.6*a)}),inset 0 0 26px rgba(241,207,126,${f2(.7*a)})`;});
}
function dotPop(d){   // neuer Punkt: klein → etwas zu groß → normal
  if(reduce)return;d.classList.add('pop');
  tween(d,240,k=>{if(k>=1){d.style.transform='';d.classList.remove('pop');return;}
    d.style.transform=`scale(${f2(k<.55?.35+.95*k/.55:1.3-.3*(k-.55)/.45)})`;});
}
function renderDots(pop){const ds=[...$('pinDots').children];ds.forEach((d,i)=>{d.classList.toggle('f',i<PIN.buf.length);if(i>=PIN.buf.length&&d.classList.contains('pop')){cancelAnimationFrame(d._tw);d.style.transform='';d.classList.remove('pop');}});
  if(pop!=null&&ds[pop])dotPop(ds[pop]);}
function pinStatus(t){$('pinSt').textContent=t;}
function pinKey(k){
  if(!PIN.mode)return;
  if(PIN.checking){if(PIN.q.length<8){PIN.q.push(k);play('tap',{gain:.55});pinPulse();}return;}   // kurz nach der 4. Ziffer: merken
  if(PIN.locked)return;   // Code-Sperre: Feld schließt gleich
  play('tap',{gain:.55});pinPulse();if(adminOpen)adminArm();
  clearTimeout(PIN.closeT);pinArm();
  let pop=null;
  if(k==='clr')PIN.buf='';
  else if(k==='back')PIN.buf=PIN.buf.slice(0,-1);
  else if(/^\d$/.test(k)&&PIN.buf.length<4){if(!PIN.buf.length)pinStatus('');PIN.buf+=k;pop=PIN.buf.length-1;}
  renderDots(pop);
  if(PIN.buf.length===4){const code=PIN.buf,m=PIN.mode;PIN.buf='';PIN.checking=true;PIN.q=[];
    setTimeout(()=>{   // 4. Punkt kurz zeigen, dann prüfen; inzwischen Getipptes danach eingeben (gleiches Feld, keine Sperre)
      if(!PIN.checking||PIN.mode!==m)return;PIN.checking=false;renderDots();pinSubmit(code);
      const q=PIN.q;PIN.q=[];if(PIN.mode===m&&!PIN.locked)q.forEach(pinKey);},140);}
}
/* Taste unter dem Finger; ein Tipp in die Fuge (12 px) oder knapp daneben zählt für die nächste Taste */
function pinBtnAt(e){
  const b=e.target.closest&&e.target.closest('#pinKeys button');if(b)return b;
  let best=null,bd=11;
  $('pinKeys').querySelectorAll('button').forEach(x=>{const r=x.getBoundingClientRect(),dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom),d=Math.hypot(dx,dy);if(d<bd){bd=d;best=x;}});
  return best;
}
function pinSubmit(code){
  const m=PIN.mode;
  if(m==='release'){
    if(code===S.pinAdmin){G.wrong=0;saveState();closePin();openAdmin();return;}
    if(code===S.pinRelease){
      G.wrong=0;
      if(allGone()){saveState();pinStatus('Alle Preise vergeben – keine Freigabe');return;}
      // ganz oder gar nicht: eine Freigabe ist 1 € und bringt immer volle N Spiele (Zählwerk zeigt höchstens 99)
      const got=S.gamesPerEuro;
      if(G.credits+got>99){saveState();pinStatus('Höchststand – erst abspielen');return;}
      G.credits+=got;ST.releases++;ST.credited+=got;saveState();saveStats();PIN.added+=got;
      play('coins');msgHold=false;clearTimeout(msgTimer);update();
      pinStatus(`+${got} ${gamesWord(got)} – für mehr: Code erneut`);
      clearTimeout(PIN.closeT);PIN.closeT=setTimeout(closePin,4000);
      return;
    }
    return pinWrong();
  }
  if(m==='confirm'){
    if(code===S.pinRelease||code===S.pinAdmin){G.wrong=0;saveState();closePin();closeWin();return;}
    return pinWrong();
  }
  if(m==='unlock'){   // Team-Ausweg aus der Code-Sperre: Admin-PIN hebt Sperre und Stufe auf
    if(code!==S.pinAdmin)return pinWrong(true);
    Object.assign(G,{lockUntil:0,lockLvl:0,wrong:0,aWrong:0,aLockUntil:0});saveState();closePin();
    if(winOpen&&G.pending)closeWin();else openAdmin();   // offene Gewinnkarte: die Admin-PIN bestätigt sie zugleich
    return;
  }
  if(m==='newpin'){
    if(PIN.step<0){   // aktuelle Admin-PIN bestätigen
      if(code!==S.pinAdmin)return pinWrong();
      G.wrong=0;saveState();PIN.step=0;$('pinT').textContent=pinTitle();pinStatus('');return;}
    const other=PIN.target==='admin'?S.pinRelease:S.pinAdmin;
    if(PIN.step===0){
      if(code===other){pinStatus('Muss sich von der anderen PIN unterscheiden');return;}
      if(code===DEF_PINS.admin||code===DEF_PINS.release){pinStatus('Bitte eine eigene PIN wählen');return;}
      PIN.first=code;PIN.step=1;$('pinT').textContent=pinTitle();pinStatus('');return;}
    if(code!==PIN.first){PIN.step=0;PIN.first='';$('pinT').textContent=pinTitle();pinStatus('Nicht gleich – bitte neu eingeben');return;}
    if(PIN.target==='admin')S.pinAdmin=code;else S.pinRelease=code;saveSettings();
    const cb=PIN.onDone;closePin();if(cb)cb(true);
  }
}
/* Falscher Code (Freigabe, Gewinn bestätigen, aktuelle Admin-PIN): 3 Fehlversuche → Code-Sperre, stufenweise länger
   (1 min; erneut innerhalb von 30 min nach dem Ende der letzten Sperre → 5 min; danach 15 min).
   viaScrew: Fehlversuch im Modus „unlock“ – eigener Zähler, sperrt nur diesen Weg und immer nur 1 Minute. */
function pinWrong(viaScrew){
  const now=Date.now();
  if(viaScrew){
    if(now-G.aWrongAt>600000)G.aWrong=0;G.aWrong++;G.aWrongAt=now;
    if(G.aWrong>=3){G.aWrong=0;G.aLockUntil=now+ALOCK_MS;saveState();PIN.locked=true;pinStatus('Gesperrt – bitte 1 Minute warten');
      clearTimeout(PIN.closeT);PIN.closeT=setTimeout(closePin,1600);return;}
    saveState();pinStatus('Falscher Code');return;
  }
  if(now-G.wrongAt>600000)G.wrong=0;   // Fehlversuche verfallen nach 10 min ohne weiteren Fehlversuch
  G.wrong++;G.wrongAt=now;
  if(G.wrong>=3){
    const lvl=G.lockUntil>0&&now-G.lockUntil<LOCK_RESET?Math.min(G.lockLvl+1,LOCK_MIN.length-1):0,min=LOCK_MIN[lvl];
    G.wrong=0;G.lockLvl=lvl;G.lockUntil=now+min*60000;saveState();PIN.locked=true;
    pinStatus(`Gesperrt – bitte ${min===1?'1 Minute':min+' Minuten'} warten`);
    clearTimeout(PIN.closeT);PIN.closeT=setTimeout(closePin,1600);return;}
  saveState();pinStatus('Falscher Code');
}
function initPin(){
  $('pinIn').addEventListener('pointerdown',e=>{if(e.button>0)return;const b=pinBtnAt(e);if(!b)return;e.preventDefault();pinKey(b.dataset.k);});
  $('pinKeys').addEventListener('click',e=>{if(e.detail===0){const b=e.target.closest('button');if(b)pinKey(b.dataset.k);}}); // Tastatur/Bedienungshilfen
  onTap($('pinX').parentElement,'#pinX',()=>{play('tap',{gain:.55});closePin();});
}

/* „+3 Spiele“ erscheint über dem Preisschild – das Zählwerk darüber bleibt frei, man sieht es hochklappen */
function toast(t){
  const h=$('toastHost');h.innerHTML='';const el=document.createElement('div');el.id='toast';el.textContent=t;
  try{const s=stage.getBoundingClientRect(),p=$('price').getBoundingClientRect(),k=scale||1;
    el.style.left=f2((p.left-s.left)/k)+'px';el.style.width=f2(p.width/k)+'px';el.style.top=f2((p.top-s.top)/k)+'px';el.style.height=f2(p.height/k)+'px';}catch(_){}
  h.appendChild(el);
  let fs=28;while(el.scrollWidth>el.clientWidth&&fs>16){fs--;el.style.fontSize=fs+'px';}
  setTimeout(()=>{if(el.parentNode)el.remove();},2400);
}

/* Schalter Musik / Ton am Automaten */
/* Schalter Musik/Ton am Automaten: wirken sofort, werden aber nicht gespeichert (Neuladen oder Admin schließen
   stellt die Admin-Einstellung wieder her). Im Admin lassen sie sich ganz sperren. */
function syncSwitches(){$('musBtn').setAttribute('aria-pressed',String(ON.music));$('sndBtn').setAttribute('aria-pressed',String(ON.sfx));}
function switchNope(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');play('tap',{gain:.5,rate:.6});}
function initSwitches(){
  onTap($('musBtn').parentElement,'#musBtn',b=>{poke();if(S.switchLock)return switchNope(b);
    // Solange noch kein Stück zu hören war (erster Tipp des Tages startet gerade die Musik), schaltet der Tipp nicht aus –
    // sonst wäre „einmal tippen, damit Musik startet“ auf genau diesem Schalter Stille.
    if(ON.music&&!M.played&&M.status!=='fehler'){play('tap');if(!M.on)musicStart();return;}
    ON.music=!ON.music;syncSwitches();play('tap');applyLevels();if(!M.on)musicStart();});
  onTap($('sndBtn').parentElement,'#sndBtn',b=>{poke();if(S.switchLock)return switchNope(b);ON.sfx=!ON.sfx;syncSwitches();applyLevels();if(ON.sfx)play('tap');});
  syncSwitches();
}
function initKeys(){
  onTap($('win'),'#winOk',onWinOk);
  onTap(spinBtn.parentElement,'#spin',()=>{poke();play('tap');autoPull();});
  addEventListener('keydown',e=>{
    if(PIN.mode){
      if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('back');else if(e.key==='Escape')closePin();
      e.preventDefault();return;
    }
    if(adminOpen){if(e.key==='Escape')closeAdmin();return;}
    if(e.repeat)return;poke();
    if(winOpen){if((e.key==='Enter'||e.key===' ')){e.preventDefault();onWinOk();}return;}
    if(e.code==='Space'||e.key===' '){e.preventDefault();autoPull();}
  });
}

}

/* Gelten noch Standard-PINs (auch nach „Alle Einstellungen auf Standard“), muss das Team sofort eigene festlegen.

function flash(id,t,bad){const el=$(id);if(!el)return;el.textContent=t;el.classList.toggle('bad',!!bad);clearTimeout(el._t);el._t=setTimeout(()=>{el.textContent='';},5000);}

      <td class="c-p"><span class="unit"><input class="in num" data-f="p" data-i="${i}" inputmode="decimal" value="${fmtN(p.p,2)}" aria-label="Wahrscheinlichkeit Freispiel">%</span></td>
      <td><span class="swl"><button type="button" class="sw" data-act="active" data-i="${i}" aria-pressed="${p.active}" aria-label="Freispiel aktiv"></button><span class="stat" data-o="st${i}">${statusText(i)}</span></span></td></tr>`;

      <td class="c-n"><span class="unit"><input class="in num${p.n<=0?' zero':''}" data-f="n" data-i="${i}" inputmode="numeric" value="${fmtN(p.n,0)}" aria-label="Bestand ${SYM_NAMES[i]}">Stk.</span></td>

      <td class="c-p">${S.auto?`<span class="autop" data-o="ap${i}" title="automatisch aus Bestand und Warenwert">${fmtN(p.p,2)}&nbsp;%</span>`:`<span class="unit"><input class="in num" data-f="p" data-i="${i}" inputmode="decimal" value="${fmtN(p.p,2)}" aria-label="Wahrscheinlichkeit ${SYM_NAMES[i]}">%</span>`}</td>
      <td><span class="swl"><button type="button" class="sw" data-act="active" data-i="${i}" aria-pressed="${p.active}" aria-label="${SYM_NAMES[i]} aktiv"></button><span class="stat" data-o="st${i}">${statusText(i)}</span></span></td></tr>`;}).join('');
  const pick=free.map(i=>`<button type="button" class="symadd${isFree(i)?' fs':''}" data-act="win" data-i="${i}" aria-label="${isFree(i)?'Freispiel einsetzen':SYM_NAMES[i]+' als Gewinn einsetzen'}"><img alt="" src="${symImg(i)}"><span>${isFree(i)?'Freispiel (Weihnachtsmann)':SYM_NAMES[i]}</span></button>`).join('');

/* Status je Preis – gleiche Aussage wie der Gewinnplan auf der Maschine */
function statusText(i){
  const p=S.prizes[i];if(!p.win)return '';
  if(!p.active)return isFree(i)?'aus':'vergriffen';
  if(!inStock(i))return 'Bestand 0';
  if(effP(i)<=0)return p.p<=0?'fällt nie (0 %)':'fällt nie (Σ>100 %)';
  if(effP(i)<p.p-1e-9)return 'gekürzt (Σ>100 %)';
  return 'aktiv';
}
const NEW_P=2,NEW_N=10;   // Chance in %, mit der ein neu eingesetzter Preis startet (vorher 0 %)
function pzSum(){
  const el=$('pzSum');if(!el)return;
  const ws=winSyms(),all=ws.reduce((a,i)=>a+S.prizes[i].p,0),act=activePrizes().reduce((a,i)=>a+effP(i),0);   // wirksam (bei Σ>100 % gekürzt), nur Gutscheine
  const fr=canFall(FREE)?effP(FREE):0;
  let h=`<div class="sumrow"><span>Gewinne: <b>${ws.length} von ${MAX_WIN}</b></span>${S.auto?`<span>Bestandswert: <b>${fmtEur(stockValue())}</b></span><span>reicht bis ≈ <b>${fmtN(S.plan,0)}&nbsp;€</b> Einnahmen</span><span>Warenwert je €: <b>${fmtEur(targetEv())}</b></span>`:`<span>Summe aller Chancen: <b>${fmtN(all,2)}&nbsp;%</b></span>`}<span>Gutschein pro Spiel: <b data-o="pzAct">${fmtN(act,2)}&nbsp;%</b></span></div>`;
  if(S.auto&&autoShort())h+=`<div class="warn">Die erwarteten Einnahmen (Reiter „Rechner“) sind zu klein für diesen Bestand: Die Chancen lägen über 100 %. Wirksam ist weniger, es bleibt Bestand übrig.</div>`;
  const fe=document.querySelector('#adBody [data-o="frEvery"]');if(fe)fe.textContent=fr>0?`≈ jedes ${fmtN(100/fr,0)}. Spiel`:'fällt nie';
  if(all>100)h+=`<div class="warn">Summe über 100 %: Preise weiter unten in der Liste fallen seltener oder nie (auf der Maschine dann „vergriffen“). Bitte Chancen senken.</div>`;
  if(allGone())h+=`<div class="warn">Kein Preis kann fallen: Die Maschine zeigt „Alle Preise vergeben“, Hebel und Freigabe sind gesperrt.</div>`;
  // Hauptgewinn-Prüfung: Die große Inszenierung (4 Blinkrunden, großer Jingle, langes Ho ho ho) gibt es nur bei Stufe „groß“.
  const aw=activePrizes(),maxV=aw.length?Math.max(...aw.map(i=>S.prizes[i].value)):0;
  if(aw.length>1&&!aw.some(i=>S.prizes[i].tier==='gross'&&S.prizes[i].value>=maxV)){
    const top=aw.find(i=>S.prizes[i].value===maxV),p=S.prizes[top];
    h+=`<div class="warn">„${esc(p.name)}“ (${fmtEur(p.value)}) ist der wertvollste Preis, hat aber Stufe „${TIER_LABEL[p.tier]}“ – die Hauptgewinn-Inszenierung gibt es nur bei „groß“. <button type="button" class="btn sm" data-act="tier" data-i="${top}" data-v="gross">Zum Hauptgewinn machen</button></div>`;}
  if(fr>20)h+=`<div class="warn">Freispiel-Chance über 20 %: Pro Euro gibt es dann deutlich mehr Spiele (und damit mehr Gutscheine) – der Rechner berücksichtigt das.</div>`;
  const zero=ws.filter(i=>S.prizes[i].active&&S.prizes[i].p<=0&&inStock(i));
  if(zero.length)h+=`<div class="warn">${zero.map(i=>'„'+esc(S.prizes[i].name)+'“').join(', ')} ${zero.length>1?'haben':'hat'} 0 % Chance – fällt nie und steht auf dem Plan als „vergriffen“.</div>`;
  const small=awardSmall().filter(i=>S.prizes[i]&&S.prizes[i].win);
  if(small.length)h+=`<div class="warn">Auf dem Plan sehr klein oder zweizeilig, am Fernseher schwer lesbar: ${small.map(i=>'„'+esc(S.prizes[i].name)+'“').join(', ')} – bitte kürzer${ws.length>=5?' (bei 5–6 Gewinnen höchstens etwa 8 Zeichen)':''}.</div>`;
  el.innerHTML=h;
  const nt=$('pzNote');if(nt)nt.hidden=h.includes('class="warn"');   // Warnungen gehen vor: fester Hilfetext nur ohne Warnung (sonst reicht die Höhe nicht)
  winSyms().forEach(i=>{const s=document.querySelector(`#adBody [data-o="st${i}"]`);if(s)s.textContent=statusText(i);});
}

/* ---------- Reiter: Rechner ---------- */

const evNow=()=>spinsPerEuro()*activePrizes().reduce((a,i)=>a+effP(i)/100*S.prizes[i].value,0);
function autoShort(){return stockValue()>0&&evNow()<targetEv()-1e-6;}

      <td class="v">${fmtEur(p.n*p.value)}</td><td class="v">${pi>0?fmtPct(pi,2):'–'}</td><td class="v">${pi>0?'≈ alle '+fmtN(per,0)+' €':'vergriffen'}</td></tr>`;}).join('');

    <table class="ct${ws.length>4?' many':''}"><thead><tr><th>Preis</th><th class="v">Warenwert</th><th class="v">Bestand</th><th class="v">Wert gesamt</th><th class="v">Chance je Spiel</th><th class="v">im Mittel 1 Stück</th></tr></thead><tbody>

      <tr><td>Jetzt</td><td class="v">${fmtEur(inc,0)}</td><td class="v">${fmtEur(stockValue())}</td><td class="v">${fmtEur(evNow(),2)}</td><td class="v">${fmtPct(pc,1)}</td><td class="v">${fmtPct(atLeast1,0)}</td></tr>

    ${autoShort()?'<div class="warn">Bestand zu groß für die erwarteten Einnahmen: Die Chancen lägen über 100 %. Erwartete Einnahmen erhöhen.</div>':''}

function tabRechner(){

  const met=[['p','Gewinnchance pro Spiel','p = Σpᵢ'],['E','Erw. Gutscheinwert pro Spiel','E = Σ pᵢ·Wertᵢ'],['X','Gutscheinwert pro Euro',`${n}·E`],

    ${ws.map(i=>`<tr><td><span class="pname"><img alt="" src="${medalImg(i)}">${esc(S.prizes[i].name)}</span></td><td class="v">${fmtEur(S.prizes[i].value,2)}</td>
      <td><span class="unit"><input class="in num kin" data-f="k" data-i="${i}" inputmode="numeric" value="${fmtN(S.calc.k[i],0)}" autocomplete="off" aria-label="Kontingent ${esc(S.prizes[i].name)}">Stk.</span></td>
      <td class="v" data-o="ps${i}"></td><td class="v" data-o="pc${i}"></td><td class="v" data-o="ex${i}"></td></tr>`).join('')||'<tr><td colspan="6">Keine Gewinnsymbole eingestellt.</td></tr>'}

  </div>`;

function calcUpdate(){
  const b=$('adBody'),o=k=>b.querySelector(`[data-o="${k}"]`),set=(k,v)=>{const el=o(k);if(el)el.textContent=v;};
  const m=calcModel(S.calc.euros,S.calc.k,S.gamesPerEuro);
  set('games',m.free>0?`→ ${fmtN(m.games,0)} Spiele (${S.gamesPerEuro} pro Euro + Freispiele ≈ ${fmtN(m.gpeEff,2)})`:`→ ${fmtN(m.games,0)} Spiele (${S.gamesPerEuro} pro Euro)`);
  m.rows.forEach(r=>{set('ps'+r.i,fmtPct(r.pSug,2));set('pc'+r.i,r.active?fmtPct(r.pCur,2):'vergriffen');set('ex'+r.i,fmtN(r.expSug,1)+' / '+fmtN(r.expCur,1));});
  for(const [p,a] of [['s',m.sug],['c',m.cur]]){set(p+'p',fmtPct(a.p,1));set(p+'E',fmtEur(a.E,3));set(p+'X',fmtEur(a.perEuro,3));set(p+'M',fmtEur(a.margin,3));set(p+'A',fmtPct(a.atLeast1,1));}
  const why=applyBlock(m),ab=b.querySelector('[data-act="apply"]');if(ab)ab.disabled=!!why;
  const w=[];
  if(m.sug.p>1+EPS)w.push('Vorschlag: Summe der Chancen über 100 % – Kontingente größer als die Zahl der Spiele. Vorschlag kann so nicht übernommen werden.');
  if(winSyms().reduce((a,i)=>a+S.prizes[i].p,0)>100+EPS)w.push('Eingestellt: Summe der Chancen über 100 % – wirksam ist nur, was in 100 % passt (Zeile „Eingestellt“).');
  if(m.sug.perEuro>1+EPS)w.push('Vorschlag: Mehr Gutscheinwert pro Euro, als eingenommen wird (über 1 €).');
  if(m.cur.perEuro>1+EPS)w.push('Eingestellt: Mehr Gutscheinwert pro Euro, als eingenommen wird (über 1 €).');
  if(m.games<=0)w.push('Bitte erwartete Einnahmen eintragen.');
  else if(m.rows.length&&m.sug.p<=0)w.push('Bitte Kontingente eintragen – mit 0 Stück würde kein Preis mehr fallen.');
  else{const z=zeroRows(m);if(z.length)w.push(`Rot markiert: Kontingent 0 bei ${z.length>1?z.length+' Preisen':'„'+z[0].name+'“'} – nach „Vorschlag übernehmen“ ${z.length>1?'fielen sie':'fiele er'} nie (Plan: „vergriffen“).`);}
  const zr=zeroRows(m).map(r=>r.i);b.querySelectorAll('input.kin').forEach(el=>el.classList.toggle('zero',zr.includes(+el.dataset.i)));
  const el=o('warn');if(el)el.innerHTML=w.map(t=>`<div class="warn">${esc(t)}</div>`).join('');
}

const EPS=1e-9;   // Rundungsrauschen (10/30 + 5/30 + 15/30 ist nicht exakt 1)
/* „Vorschlag übernehmen“ nur, wenn der Vorschlag spielbar ist (sonst Grund als Text) */
function applyBlock(m){
  if(!m.rows.length)return 'keine Gewinnsymbole';
  if(m.games<=0)return 'keine Einnahmen';
  if(m.sug.p<=0)return 'keine Kontingente';
  if(m.sug.p>1+EPS)return 'Summe über 100 %';
  return '';
}
const zeroRows=m=>m.rows.filter(r=>r.active&&r.k<=0);   // aktive Preise ohne Kontingent: fielen nach „Übernehmen“ nie
function applySuggestion(){
  const m=calcModel(S.calc.euros,S.calc.k,S.gamesPerEuro);if(applyBlock(m))return;
  const go=()=>{m.rows.forEach(r=>{S.prizes[r.i].p=Math.round(clamp(r.pSug*100,0,100)*100)/100;});
    changed();calcUpdate();flash('cMsg','Übernommen – siehe Reiter „Preise“.');};
  const why=[],z=zeroRows(m);
  if(z.length)why.push(`${z.map(r=>'„'+r.name+'“').join(', ')} ${z.length>1?'haben':'hat'} Kontingent 0 und fiele${z.length>1?'n':''} danach nie (auf dem Plan „vergriffen“).`);
  if(m.sug.perEuro>1+EPS)why.push(`Im Mittel würden pro eingenommenem Euro ${fmtEur(m.sug.perEuro,2)} Gutscheinwert ausgegeben – mehr, als hereinkommt.`);
  if(why.length)askConfirm('Vorschlag trotzdem übernehmen?',why.join(' '),'Ja, übernehmen',go);
  else go();
}

const mmss=sec=>{const s=Math.round(sec);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function trackItem(t,ti){
  const on=trackOn(t),av=PL.includes(ti),meta=[t.d?mmss(t.d):'',t.s].filter(Boolean).join(' · ')||t.a;   // Dauer zuerst: bei langem Stil wird nur dieser gekürzt

    `<button type="button" class="btn play" data-act="aud" data-k="mus:${ti}" title="${av?esc(t.t)+' – '+esc(t.a):'nur in der installierten App'}"${av?'':' disabled'}><span class="mt"><b>${ti+1}. ${esc(t.t)}</b><small>${esc(meta)}</small></span><i class="eq" aria-hidden="true"><i></i><i></i><i></i></i></button></div>`;

/* „Läuft gerade“ und Schalter-Zustand, solange der Reiter offen ist */
const TON={t:0};
function tonStop(){clearInterval(TON.t);TON.t=0;}
function tonTick(){
  const b=$('adBody'),el=b.querySelector('[data-o="musNow"]');if(!el){tonStop();return;}
  const p=M.status==='spielt'?nowPlaying():null,mute=!ON.music||S.musicVol<=0;
  el.textContent=p&&TRACKS[p.ti]?`Läuft gerade${mute?' (stumm)':''}: ${p.ti+1}. ${TRACKS[p.ti].t}`:
    M.status==='fehler'?'Musik konnte nicht geladen werden.':M.status==='lädt'?'Musik wird geladen …':
    PREVIEW?`Vorschau-Version: ${PL.length} von ${TRACKS.length} Stücken eingebettet.`:'Musik startet nach der ersten Berührung.';
  const nb=b.querySelector('[data-act="musNext"]');if(nb)nb.disabled=!p||M.skip||playList().length<2;
  b.querySelectorAll('.trk').forEach(r=>{const ti=+r.dataset.ti,on=trackOn(TRACKS[ti]);r.classList.toggle('now',!!p&&p.ti===ti);r.classList.toggle('off',!on);
    const sw=r.querySelector('.sw');if(sw)sw.setAttribute('aria-pressed',String(on));});
}
function tonAfter(){
  AUD.onend=()=>{document.querySelectorAll('#adBody .play.on').forEach(b=>b.classList.remove('on'));};
  AUD.onfail=()=>flash('tonMsg','Stück konnte nicht geladen werden.',true);
  tonStop();TON.t=setInterval(tonTick,500);tonTick();
}
function toggleTrack(ti){
  const t=TRACKS[ti];if(!t)return;const on=!trackOn(t);
  if(!on&&TRACKS.filter(x=>trackOn(x)).length<=1){flash('tonMsg','Mindestens ein Stück muss an bleiben.',true);return;}
  S.tracks[t.f]=on;saveSettings();musicReplan();tonTick();
  flash('tonMsg',`${ti+1}. ${t.t}: ${on?'an':'aus'}${!on&&nowPlaying()&&nowPlaying().ti===ti?' – nächstes Stück wird eingeblendet':''}.`);
}
async function nextTrack(){
  audStop();
  if(M.status!=='spielt'){flash('tonMsg','Die Musik läuft noch nicht.',true);return;}
  const pr=musicSkip();tonTick();const ok=await pr;tonTick();   // während des Ladens ist der Knopf gesperrt
  if(ok===false)flash('tonMsg','Nächstes Stück konnte nicht geladen werden.',true);
}

const DIAG_ROWS=[['dStart','Start als'],['dTop','Oben'],['dSize','Maße'],['dFs','Vollbild'],['offl','Offline'],['dStore','Speicher'],['dVer','Version']];
function diagData(){
  const t=TOPCAP,ua=navigator.userAgent,bv=/Version\/([\d.]+)/.exec(ua)||/(?:Chrome|CriOS|Firefox|FxiOS)\/(\d+)/.exec(ua);
  const br=/Version\//.test(ua)?'Safari':/Chrome|CriOS/.test(ua)?'Chrome':/Firefox|FxiOS/.test(ua)?'Firefox':'Browser';

/* Credits und GEMA-Text aus der Stückliste (src/music.json): genau die ausgelieferten Stücke.
   CC BY verlangt Titel, Urheber, Quelle, Lizenz (mit Link) und den Hinweis auf Änderungen – alles steht in der Liste. */
function licUrl(lic){const m=/^CC (BY(?:-SA)?) (\d\.\d)$/.exec(lic);return m?`creativecommons.org/licenses/${m[1].toLowerCase()}/${m[2]}/`:'';}   // CC0: kein Link nötig
const andList=l=>l.length>1?l.slice(0,-1).join(', ')+' und '+l[l.length-1]:(l[0]||'');
function musicCredit(){   // „Musik: A und B, CC0 1.0; C, CC BY 4.0.“
  const by={};TRACKS.forEach(t=>{const l=by[t.lic]=by[t.lic]||[];if(!l.includes(t.a))l.push(t.a);});
  return 'Musik: '+Object.entries(by).map(([lic,a])=>`${andList(a)}, ${lic}`).join('; ')+'.';
}
function musicLicText(){
  const cc0=TRACKS.every(t=>t.lic==='CC0 1.0'),orig=TRACKS.some(t=>t.orig);
  return (cc0?'Alle Stücke sind von den Urhebern unter CC0 1.0 gemeinfrei gewidmet':
      'Lizenzen: CC0 1.0 = gemeinfrei gewidmet, CC BY = frei mit Namensnennung (Urheber, Titel und Quelle stehen oben)')+
    '; keine Quellseite nennt eine Mitgliedschaft in der GEMA oder einer anderen Verwertungsgesellschaft; '+
    (orig?'Bearbeitungen gemeinfreier Melodien sind mit ihrer Vorlage genannt.':'keine Bearbeitung bekannter Weihnachtslieder.')+
    (cc0?'':' Die Stücke wurden für die App angepasst (z. B. gekürzt, Lautstärke angeglichen, neu kodiert); Einzelheiten unter „geändert“ und in audio/CREDITS.md.')+
    (TRACKS.some(t=>!trackOn(t))?' „Zurzeit aus“: mitgeliefert, läuft aber nicht (Admin → Ton).':'');
}

/* Offline bereit? Der Service Worker meldet, wie viele Dateien seiner Liste im Cache liegen. */
function offlineStatus(cb){
  if(PREVIEW)return cb('Vorschau-Datei: nicht offline-fähig – am Stand die installierte App verwenden.',false);
  try{
    const sw=navigator.serviceWorker;
    if(!sw||!sw.controller)return cb('Offline bereit: nein – Speicher noch nicht aktiv. App mit Internet öffnen, schließen und erneut öffnen.',false);
    let done=false;
    const on=e=>{const d=e.data;if(!d||d.type!=='wj-status')return;done=true;sw.removeEventListener('message',on);
      cb(d.have===d.total?`Offline bereit: ja (${d.have}/${d.total} Dateien, Version ${String(d.version).replace(/^wj-/,'')})`:
        `Offline bereit: nein (${d.have}/${d.total} Dateien gespeichert) – mit Internet offen lassen.`,d.have===d.total);};
    sw.addEventListener('message',on);sw.controller.postMessage({type:'wj-status'});
    setTimeout(()=>{if(!done){sw.removeEventListener('message',on);cb('Offline bereit: unbekannt (keine Antwort vom Speicher).',false);}},3000);
  }catch(_){cb('Offline bereit: unbekannt.',false);}
}
function infosAfter(){
  offlineStatus((t,ok)=>{const el=document.querySelector('#adBody [data-o="offl"]');if(el){el.textContent=t;el.classList.toggle('ok',ok);el.classList.toggle('bad',!ok);}});
  infoStop();INFO.t=setInterval(infoTick,1000);infoTick();
}

function onAct(e){

      // passendes Kontingent für den Rechner (sonst setzte „Vorschlag übernehmen“ ihn wieder auf 0 %)
      let pre=false;if(p.win&&p.p<=0){p.p=NEW_P;pre=true;}
      if(p.win&&!isFree(i)&&p.n<=0)p.n=NEW_N;   // Bestand vorbelegen, sonst wäre er sofort vergriffen
      if(p.win&&!isFree(i)&&!(S.calc.k[i]>0))S.calc.k[i]=Math.max(1,Math.round(S.calc.euros*S.gamesPerEuro*p.p/100));
      changed();rerender();
      if(p.win){const tr=document.querySelector(`#adBody .pz tbody [data-act="win"][data-i="${i}"]`);if(tr){const row=tr.closest('tr');row.classList.add('fresh');setTimeout(()=>row.classList.remove('fresh'),2600);}}
      if(isFree(i)){flash('pzMsg',p.win?`Freispiel eingesetzt mit ${fmtN(p.p,2)} % – 3× Weihnachtsmann gibt +${S.freeN} ${gamesWord(S.freeN)}.`:'Freispiel ist aus (Werte bleiben gespeichert).');break;}
      flash('pzMsg',p.win?`„${p.name}“ eingesetzt${S.auto?` mit Bestand ${fmtN(p.n,0)}`:pre?` mit ${fmtN(NEW_P,0)} % Chance`:''} – bitte Name, Warenwert, Bestand und Stufe prüfen.`:`„${p.name}“ ist kein Gewinn mehr (Werte bleiben gespeichert).`);break;}
    case 'active':S.prizes[i].active=!S.prizes[i].active;changed();rerender();break;
    case 'freeN':S.freeN=clamp(+v,1,3);changed();rerender();break;
    case 'auto':S.auto=!S.auto;if(!S.auto)activePrizes().forEach(i=>{S.prizes[i].p=Math.round(S.prizes[i].p*100)/100;});changed();rerender();
      flash('cMsg',S.auto?'Automatik an – Chancen kommen aus Bestand und Warenwert.':'Automatik aus – Chancen jetzt von Hand (aktuelle Werte übernommen).');break;
    case 'tier':S.prizes[i].tier=v;changed();rerender();break;
    case 'apply':applySuggestion();break;
    case 'copy':copyStats();break;
    case 'resetStats':askConfirm('Statistik zurücksetzen?','Alle Zähler und die Liste der letzten Gewinne werden gelöscht. Gutschein-Nummern laufen weiter.','Ja, zurücksetzen',()=>{ST=emptyStats();saveStats();autoP();saveSettings();rerender();flash('stMsg','Statistik zurückgesetzt.');});break;
    case 'musicOn':S.musicOn=!S.musicOn;ON.music=S.musicOn;saveSettings();syncSwitches();applyLevels();if(!M.on)musicStart();b.setAttribute('aria-pressed',String(S.musicOn));break;
    case 'sfxOn':S.sfxOn=!S.sfxOn;ON.sfx=S.sfxOn;saveSettings();syncSwitches();applyLevels();b.setAttribute('aria-pressed',String(S.sfxOn));break;
    case 'swlock':S.switchLock=v==='true';saveSettings();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));break;
    case 'hoho':S.hoho=v;saveSettings();b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));break;
    case 'aud':{const k=b.dataset.k,was=AUD.key===k;audStop();if(!was){b.classList.add('on');audPlay(k);}break;}
    case 'trk':toggleTrack(i);break;
    case 'musNext':nextTrack();break;
    case 'gpe':S.gamesPerEuro=clamp(S.gamesPerEuro+(+b.dataset.d),1,10);changed();rerender();break;
    case 'confirm':S.confirm=v==='pin'?'pin':'tap';changed();rerender();break;
    case 'pin':
      if(Date.now()<G.lockUntil){flash('setMsg',`Code-Sperre – bitte noch ${lockLeft()} warten.`,true);break;}
      openPin('newpin',{target:v,verify:v==='admin',onDone:()=>flash('setMsg',v==='admin'?'Admin-PIN geändert.':'Freigabe-PIN geändert.')});break;
    case 'vjump':{const next=Math.floor(G.voucher/100)*100+101;
      askConfirm('Neue Nummernserie?',`Die nächste Gutschein-Nummer wird ${pad3(next)} statt ${pad3(G.voucher+1)}. Gedacht nach einer Neuinstallation, damit keine Nummer doppelt vorkommt.`,'Ja, ab '+pad3(next),
        ()=>{G.voucher=next-1;saveState();rerender();flash('setMsg','Nächste Gutschein-Nr.: '+pad3(next)+'.');});break;}
    case 'zero':askConfirm('Guthaben auf 0 setzen?',`Die ${G.credits} ${gamesWord(G.credits)} auf der Maschine verfallen. Die Statistik bleibt unverändert.`,'Ja, auf 0',()=>{G.credits=0;saveState();update();rerender();flash('setMsg','Guthaben auf 0 gesetzt.');});break;
    case 'defaults':askConfirm('Alle Einstellungen auf Standard?','Preise, Chancen, Rechner, Ton, die Auswahl der Musikstücke (wieder wie ausgeliefert) und beide PINs werden auf die Werkseinstellung gesetzt; danach bitte sofort neue PINs festlegen. Statistik und Gutschein-Nummern bleiben.','Ja, zurücksetzen',
      ()=>{S=defaultSettings();onFromSettings();changed();applyLevels();musicReplan();fit();rerender();flash('setMsg','Werkseinstellungen geladen.');forcePins();});break;
    case 'chk':{const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));break;}

  }

function onField(e,commit){
  const el=e.target.closest('[data-f]');if(!el||!$('adBody').contains(el))return;
  const f=el.dataset.f,i=+el.dataset.i;
  if(f==='name'||f==='value'||f==='p'){
    if(!commit){if(f==='name'&&el.value.length>=NAME_MAX)flash('pzMsg',`Name: höchstens ${NAME_MAX} Zeichen.`,true);return;}
    const p=S.prizes[i];
    if(f==='name'){p.name=el.value.replace(/\s+/g,' ').trim().slice(0,NAME_MAX)||SYM_NAMES[i];el.value=p.name;}
    else{const v=parseNum(el.value);if(Number.isFinite(v))p[f]=Math.round(clamp(v,0,100)*100)/100;el.value=fmtN(p[f],2);}
    changed();pzSum();refreshAutoP();return;
  }
  if(f==='n'){
    if(!commit)return;const v=parseNum(el.value,true);
    if(Number.isFinite(v))S.prizes[i].n=Math.round(clamp(v,0,STOCK_MAX));
    el.value=fmtN(S.prizes[i].n,0);el.classList.toggle('zero',S.prizes[i].n<=0);changed();pzSum();refreshAutoP();return;
  }
  if(f==='plan'){
    if(!commit)return;const v=parseNum(el.value,true);
    if(Number.isFinite(v)&&v>0)S.plan=Math.round(clamp(v,10,100000));
    changed();rerender();flash('cMsg','Chancen neu berechnet.');return;
  }
  if(f==='euros'||f==='k'){
    const v=parseNum(el.value,true);
    if(Number.isFinite(v)){const r=Math.round(clamp(v,0,100000));if(f==='euros')S.calc.euros=r;else S.calc.k[i]=r;}
    if(commit){el.value=f==='euros'?fmtN(S.calc.euros,0):fmtN(S.calc.k[i],0);saveSettings();}
    calcUpdate();return;
  }
  if(f==='musicVol'||f==='sfxVol'){
    S[f]=clamp((+el.value||0)/100,0,1);const o=$('adBody').querySelector(`[data-o="${f}"]`);if(o)o.textContent=Math.round(S[f]*100)+' %';
    applyLevels();if(commit){saveSettings();if(f==='sfxVol')play('tap',{force:true});}
  }
}
function refreshAutoP(){if(!S.auto)return;winSyms().forEach(i=>{const el=document.querySelector(`#adBody [data-o="ap${i}"]`);if(el)el.textContent=fmtN(S.prizes[i].p,2)+'\u00a0%';});}
function initAdmin(){
  ['pointerdown','keydown','input','change'].forEach(t=>$('admin').addEventListener(t,adminArm,true));   // jede Bedienung verlängert
  onTap($('adTabs'),'[data-tab]',b=>{commitField();play('tap',{gain:.45});showTab(b.dataset.tab);});
  onTap($('adClose').parentElement,'#adClose',()=>{play('tap',{gain:.45});closeAdmin();});
  const body=$('adBody');
  onTap(body,'[data-act]',b=>onAct({target:b}));
  body.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chk')){e.preventDefault();onAct(e);}
    if(e.key==='Enter'&&e.target.matches('input.in')){e.target.blur();}});
  body.addEventListener('input',e=>onField(e,false));
  // iPad: nach dem Schließen der Bildschirmtastatur Seite wieder an den Ursprung (Body ist fixiert)
  body.addEventListener('focusout',()=>setTimeout(()=>{const ae=document.activeElement;if(!ae||ae===document.body){try{window.scrollTo(0,0);}catch(_){}}},60));
  body.addEventListener('change',e=>onField(e,true));
}

/* --- 90-boot.js --- */
/* ================= Start ================= */
function boot(){
  const ld=$('logoData');logoUri=ld&&ld.textContent.trim()?'data:image/png;base64,'+ld.textContent.trim():'';
  msgEl=$('msg');spinBtn=$('spin');windowEl=$('window');
  fillerWeights();initCounter();initReels();initLever();initRefill();initPin();initAdmin();initSwitches();initKeys();initFullscreen();
  initAudio();
  ['pointerdown','pointerup','touchend','keydown','click'].forEach(t=>addEventListener(t,unlock,{capture:true,passive:true}));
  document.addEventListener('visibilitychange',()=>{if(document.hidden)return;keepAwake();if(A.ctx&&A.unlocked)unlock();});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('resize',fit);
  addEventListener('orientationchange',()=>setTimeout(fit,250));
  buildAward();$('priceN').textContent=`${S.gamesPerEuro} ${gamesWord(S.gamesPerEuro)}`;
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{layoutMarquee();fitAward();fitMsg();}).catch(()=>{});
  setInterval(()=>{lightTick();lampTick();},50);lightTick();
  setInterval(()=>{if(canPlay()&&!msgHold&&!drag){idleMsgI++;update();}},6500);
  setInterval(()=>{ // Anlock-Modus nach 30 s ohne Bedienung (nicht während Admin/PIN)
    if(busy||winOpen||drag||paused)return;const t=performance.now();
    if(t-lastInteract>30000&&(lightMode==='idle'||lightMode==='locked')){setLights('attract');
      if(A.unlocked&&t-A.lastSleigh>180000&&!allGone()){A.lastSleigh=t;play('sleigh',{gain:.55});}}
  },1000);
  update();
  if(G.pending){ // Gewinn war noch offen (z. B. nach Neuladen): Gutschein wieder zeigen
    const w=G.pending;winOpen=true;reels.forEach((r,i)=>r.set(makeRows([w.sym,w.sym,w.sym]),i));
    msgHold=true;setMsg(w.tier==='gross'?`Hauptgewinn: ${w.name}!`:`Gewonnen: ${w.name}!`);update();showTicket(w,true);
  }
  requestAnimationFrame(()=>body.classList.add('booted'));
  if(!PREVIEW&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    try{navigator.serviceWorker.register('sw.js').catch(()=>{});
      /* Update (neue Version auf dem Webspace): Der neue Service Worker übernimmt und löscht den alten Speicher – die noch
         laufende alte Seite fände dann z. B. umbenannte Musikdateien nicht mehr. Deshalb einmal neu laden, sobald gerade
         nichts läuft (Guthaben, Einstellungen und ein offener Gewinn sind ohnehin gespeichert). Die erste Installation
         (vorher kein Service Worker) braucht das nicht. */
      let had=!!navigator.serviceWorker.controller,reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(!had){had=true;return;}
        if(reloading)return;reloading=true;
        const go=()=>{if(busy||winOpen||PIN.mode||adminOpen||drag||rf){setTimeout(go,2000);return;}location.reload();};go();
      });
    }catch(_){}
  }
  if(TEST)window.__jp={
    credits:()=>G.credits,W:()=>W,scale:()=>scale,
    state:()=>JSON.parse(JSON.stringify({G,S,ST})),
    force:s=>{forced=s;},
    drawStats(n){const c=Array(NSYM).fill(0),seen=Array(NSYM).fill(0);let none=0,sideTriple=0,loseTriple=0,winRowBad=0,diagTriple=0;
      for(let k=0;k<n;k++){const r=drawRaw();if(r.sym>=0)c[r.sym]++;else none++;r.rows.forEach(row=>row.forEach(x=>seen[x]++));
        for(const row of [r.rows[0],r.rows[2]])if(row[0]===row[1]&&row[1]===row[2])sideTriple++;
        const [rt,rm,rb]=r.rows;if(tri(rt[0],rm[1],rb[2])||tri(rb[0],rm[1],rt[2]))diagTriple++;
        const m=r.rows[1];if(r.sym<0&&m[0]===m[1]&&m[1]===m[2])loseTriple++;
        if(r.sym>=0&&!(m[0]===r.sym&&m[1]===r.sym&&m[2]===r.sym))winRowBad++;}
      return{n,counts:c,seen,none,sideTriple,loseTriple,winRowBad,diagTriple,crypto:rand!==Math.random};},
    nsym:()=>NSYM,maxWin:()=>MAX_WIN,
    effP:i=>effP(i),parseNum:(s,i)=>parseNum(s,i),
    shown:()=>reels.map(r=>r.shown()),
    audio:()=>({state:A.ctx&&A.ctx.state,ready:A.ready,bad:Object.keys(A.bad),dur:Object.fromEntries(Object.entries(A.buf).map(([k,b])=>[k,Math.round(b.duration*1e3)/1e3])),lastVoice:A.lastVoice}),
    music:()=>{const p=nowPlaying();return{status:M.status,played:M.played,err:M.err,pos:p?p.ti:-1,cur:M.cur?M.cur.ti:-1,dur:p?+(p.end-p.t).toFixed(2):0,
      tracks:PL.slice(),list:playList(),n:TRACKS.length,files:TRACKS.map(t=>t.f),defs:TRACKS.map(t=>t.def!==false),preview:PREVIEW};},
    pickStart:n=>Array.from({length:n},pickStart),
    musicSkip:async()=>{const prev=nowPlaying();const ok=await musicSkip();return{ok,prevPos:prev?prev.ti:-1,pos:M.cur?M.cur.ti:-1,t:M.cur?+M.cur.t.toFixed(3):0,now:+A.ctx.currentTime.toFixed(3),xs:XS};},
    marquee:()=>Object.assign({},MED,{W,scale,bulbs:bulbs.map(b=>[b._x,b._y])}),
    calc:()=>calcModel(S.calc.euros,S.calc.k,S.gamesPerEuro),
    musicNext:async()=>{const prev=M.cur;if(!prev)return null;await scheduleNext(M.gen,prev);
      return{prevPos:prev.ti,prevEnd:+prev.end.toFixed(3),pos:M.cur.ti,t:+M.cur.t.toFixed(3),xo:XO,prevFallback:!!prev.s.onended};},
    busy:()=>busy,winOpen:()=>winOpen,paused:()=>paused,
    topCap:()=>Object.assign({},TOPCAP),fs:()=>Object.assign({},FS,{el:!!fsEl(),avail:fsAvail(),mode:S.fullscreen}),
    sleigh:()=>{sleighRide();return !!sleighEl;},
    logoDemo:(s,k)=>{const m=medalEl(s);if(m)m.classList.toggle('press',k>0);ringSet(s,k);},   // nur für Screenshots: Logo gehalten, Ring zu k
  };
}
boot();
