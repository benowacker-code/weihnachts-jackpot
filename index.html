:root{
  /* Farbsystem: Lackrot · Creme · Tannengrün · Chrom · Tinte  (+ Glühlicht nur als Licht) */
  --lack:#8a2227; --lack-hell:#ad3a3d; --lack-tief:#4f1114; --lack-nacht:#1c0507;
  --creme:#f3e6c8; --creme-hell:#fbf5e6; --papier:#f6eddb;
  --gruen:#1f4a36; --gruen-hell:#2e6a4c; --gruen-tief:#123020;
  --tinte:#221915;
  --licht:#ffe7a8;
  --chrom:linear-gradient(180deg,#fdfefe 0%,#d7dcdf 14%,#a3abb1 40%,#5d656b 50%,#c3c9cd 57%,#eef1f2 84%,#aeb5ba 100%);
  --chrom-weich:linear-gradient(180deg,#f4f6f7 0%,#c9ced2 45%,#8d959b 52%,#d5d9dc 60%,#eef0f1 100%);
  /* Satin-Chrom für beschriftete Knöpfe: dunkles Band unterhalb der Schrift, damit sie nicht „durchgestrichen“ wirkt */
  --chrom-btn:linear-gradient(180deg,#f7f8f9 0%,#e4e7e9 46%,#d0d5d8 70%,#a3abb1 78%,#cdd2d5 86%,#eef0f1 100%);
  --f-script:"Yesteryear","Brush Script MT",cursive;
  --f-ui:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
/* ---------- Rand oben (iPad-Statusleiste, iPadOS 26/27) ----------
   #topcap: ruhige, einfarbige Gehäuse-Abdeckung oben – nur in der Home-Bildschirm-App (Höhe setzt topCap(), vorher gilt die
   Media-Query). Sie liegt unter Uhrzeit und Akku und unter der Kanten-Unschärfe von iPadOS; die Maschine wird darunter
   eingepasst. Absichtlich einfarbige background-color (kein Verlauf), volle Breite, über 10 px hoch und schon im HTML: dann nimmt
   iPadOS (WebKit, „fixed container edges“) diese Farbe für den Streifen unter der Statusleiste, statt den Inhalt zu verwischen. */
#topcap{position:fixed;left:0;right:0;top:0;height:0;z-index:2147483647;pointer-events:none;background-color:#2b0a0c}
@media (display-mode: standalone),(display-mode: fullscreen){#topcap{height:calc(env(safe-area-inset-top,0px) + 16px)}}
/* Messfühler für env(safe-area-inset-top) (--sim-sat nur im Testmodus) */
#safeProbe{position:fixed;left:0;top:0;width:1px;height:var(--sim-sat,env(safe-area-inset-top,0px));visibility:hidden;pointer-events:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#070203;color:var(--creme);font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none}
img{-webkit-user-drag:none;user-select:none}

/* ---------- Bühne: Höhe fest 820, Breite folgt dem Seitenverhältnis (4:3 … 1,52:1) ---------- */
#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;transform-origin:50% 50%;overflow:hidden;--side:254px;--cxl:142px}
.layer{position:absolute;left:0;top:0;height:820px;pointer-events:none;overflow:visible}

/* ---------- Glühbirnen im Marquee ---------- */
.bulb{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#f1e2c4 0%,#c3a57a 38%,#6f5233 100%);
  box-shadow:0 0 0 2.5px #9da5ab,0 0 0 4px #1a0a08}
.bulb::before{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,140,.6) 0%,rgba(255,196,110,.2) 38%,rgba(255,196,110,0) 70%);opacity:0;transition:opacity .2s}
.bulb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fffef8 0%,#fff0c6 30%,#f6c771 72%,#c98b38 100%);opacity:0;transition:opacity .15s}
.bulb.on::before,.bulb.on::after{opacity:1}

#title{position:absolute;left:50%;top:0;width:820px;height:172px;margin-left:-410px;pointer-events:none;overflow:visible;transform-origin:410px 112px}
#title .t2{transform-origin:410px 114px}
body.jackpot #title .t2{animation:thump .7s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes thump{30%{transform:scale(1.05)}}
.marquee-light{position:absolute;left:50%;top:40px;width:980px;height:122px;margin-left:-490px;pointer-events:none;opacity:0;
  background:radial-gradient(60% 85% at 50% 70%,rgba(255,250,232,.9),rgba(255,250,232,0) 75%)}
body.jackpot .marquee-light{animation:mflash .34s steps(1,end) 8}
@keyframes mflash{0%{opacity:.85}50%{opacity:0}}
/* Logo-Medaillons links und rechts der Überschrift */
#medals{z-index:2}
#medals .md{transform-box:fill-box;transform-origin:50% 50%}
body.jackpot #medals .md{animation:mdpulse .7s cubic-bezier(.3,1.6,.5,1) 3}
/* Medaillon als versteckter Auslöser: drückt sich beim Aufsetzen ein wie ein Knopf, die Messingfassung füllt sich
   (Ring, setzt JS), bei Sperre schüttelt es kurz den Kopf. In Ruhe unsichtbar. */
#medals .mdw,#medals .mdp{transform-box:fill-box;transform-origin:50% 50%}
#medals .mdp{transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
#medals .md.press .mdp{transform:scale(.95) translateY(1px);transition:transform .06s ease-out}
#medals .mdsh{opacity:0;transition:opacity .18s}
#medals .md.press .mdsh{opacity:.16;transition:opacity .06s}
#medals .md.nope .mdw{animation:mdnope .44s ease-in-out}
@keyframes mdnope{15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
@keyframes mdpulse{30%{transform:scale(1.06)}}

/* ---------- Linke Spalte: Zählwerk, Preis, Schalter ---------- */
.col{position:absolute;width:240px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.col.l{left:calc(var(--cxl) - 120px)}
.col.r{left:calc(100% - var(--cxl) - 120px)}
.col.info{top:186px;height:506px;justify-content:center;gap:40px}
.cgroup{display:flex;flex-direction:column;align-items:center}
.eng{font-weight:800;font-stretch:125%;text-transform:uppercase;color:var(--creme);text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.12)}
.lbl{font-size:21px;line-height:24px;letter-spacing:.22em;padding-left:.22em}
/* Breite aus --cw (JS): rechts bleiben ≥ 12 px bis zum Gewinnlinien-Zeiger, auch zweistellig und im 4:3-Format */
.counter{--dh:146px;--cp:10px;--dp:6px;--dg:6px;margin-top:12px;padding:var(--cp);border-radius:17px;background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 12px 20px rgba(0,0,0,.42),inset 0 1px 0 #fff}
#stage.narrow .counter{--cp:7px;--dp:5px;--dg:4px}
#stage.narrow .counter.two{--cp:6px;--dp:4px;--dg:3px}
.drums{display:flex;gap:var(--dg);padding:var(--dp);border-radius:10px;background:#140a08;box-shadow:inset 0 3px 7px #000,0 0 0 1.5px var(--tinte)}
.drum{position:relative;width:min(96px,calc(var(--cw,160px) - 2 * var(--cp) - 2 * var(--dp)));height:var(--dh);overflow:hidden;border-radius:3px;background:linear-gradient(180deg,#b6a47e 0%,#f2e5c8 20%,#fff9ec 50%,#f2e5c8 80%,#b6a47e 100%)}
.drum::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,15,5,.42),rgba(30,15,5,0) 24%,rgba(30,15,5,0) 76%,rgba(30,15,5,.42))}
.drum.lead{display:none}
.counter.two .drum{width:min(76px,calc((var(--cw,160px) - 2 * var(--cp) - 2 * var(--dp) - var(--dg)) / 2))}
.counter.two .strip span{font-stretch:62%;font-size:118px}
#stage.narrow .counter.two .strip span{font-size:92px}
.strip{position:absolute;left:0;top:0;width:100%;transition:transform .6s cubic-bezier(.3,1.35,.5,1)}
.strip span{display:block;height:var(--dh);font-weight:800;font-stretch:78%;font-size:130px;line-height:154px;text-align:center;color:var(--tinte)}
#counter.bump{animation:cbump .5s ease-out}
@keyframes cbump{30%{transform:scale(1.12);filter:brightness(1.25) drop-shadow(0 0 16px rgba(255,220,150,.7))}}
.price{padding:6px;border-radius:14px;background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 8px 14px rgba(0,0,0,.4),inset 0 1px 0 #fff;transition:filter .3s}
.price-in{width:min(164px,calc(var(--side) - 96px));padding:10px 0 12px;border-radius:9px;text-align:center;color:var(--creme);
  background:radial-gradient(130% 110% at 35% 20%,#336f50 0%,var(--gruen) 55%,var(--gruen-tief) 100%);box-shadow:inset 0 0 0 1.5px var(--tinte),inset 0 2px 6px rgba(0,0,0,.35)}
.price-in b{display:block;font-weight:900;font-stretch:112%;font-size:46px;line-height:48px;letter-spacing:.01em}
.price-in span{display:block;font-weight:700;font-stretch:100%;font-size:26px;line-height:28px;letter-spacing:.01em;margin-top:1px;white-space:nowrap}
#stage.narrow .price-in span{font-stretch:88%;font-size:25px}
.price-in i{display:block;width:100px;max-width:76%;height:1.5px;margin:7px auto 6px;background:rgba(243,230,200,.45)}
body.locked:not(.gone) .price{animation:pricepulse 1.8s ease-in-out infinite}
body.gone .price{opacity:.35;filter:grayscale(1)}   /* alle Preise vergeben: kein „bitte zahlen“ mehr */
@keyframes pricepulse{50%{filter:brightness(1.35) drop-shadow(0 0 14px rgba(255,220,150,.55))}}

/* Schalter Musik / Ton */
.switches{top:718px;flex-direction:row;justify-content:center;gap:clamp(8px,calc(var(--side) - 200px),26px);pointer-events:auto}
.tg{border:0;background:none;padding:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.tg svg{width:52px;height:52px;display:block}
.tg .cap{display:flex;align-items:center;gap:5px;font-size:12px;line-height:14px;font-stretch:108%;letter-spacing:.12em;padding-left:.12em;white-space:nowrap}
.tg .lamp{width:8px;height:8px;border-radius:50%;background:#3a1a12;box-shadow:0 0 0 1.5px var(--tinte);transition:background .2s,box-shadow .2s}
.tg[aria-pressed="true"] .lamp{background:#ffe2a0;box-shadow:0 0 0 1.5px var(--tinte),0 0 8px 2px rgba(255,214,140,.7)}
.tg .bat{transition:transform .18s cubic-bezier(.3,1.5,.5,1);transform-origin:26px 26px}
.tg[aria-pressed="false"] .bat{transform:rotate(180deg)}
.tg:focus-visible,.spin:focus-visible{outline:2px solid var(--licht);outline-offset:4px;border-radius:10px}
.tg.nope svg{animation:tgnope .36s}
@keyframes tgnope{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

/* ---------- Mitte: Walzenfenster, Anzeige, Gewinnplan ---------- */
#center{position:absolute;left:var(--side);top:0;width:672px;height:820px;pointer-events:none}
.window{position:absolute;left:0;top:184px;width:672px;height:450px;border-radius:20px;background:var(--chrom);
  box-shadow:0 0 0 2px var(--tinte),0 14px 30px rgba(0,0,0,.5),0 3px 6px rgba(0,0,0,.35),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.35)}
.window::before{content:"";position:absolute;inset:6px;border-radius:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 0 0 2px rgba(0,0,0,.14);pointer-events:none}
.opening{position:absolute;left:14px;top:14px;width:644px;height:422px;border-radius:9px;background:#120907;overflow:hidden;box-shadow:inset 0 0 0 2px #0b0604}
.reels{position:absolute;left:10px;top:7px;display:flex;gap:12px}
.reel{position:relative;width:200px;height:408px;overflow:hidden;border-radius:3px;
  background:linear-gradient(90deg,#cbb993 0%,#eee0c1 13%,#fcf6e6 50%,#eee0c1 87%,#cbb993 100%)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(38,20,10,.66) 0%,rgba(38,20,10,.3) 14%,rgba(38,20,10,.12) 30%,rgba(38,20,10,0) 33.4%,rgba(38,20,10,0) 66.6%,rgba(38,20,10,.12) 70%,rgba(38,20,10,.3) 86%,rgba(38,20,10,.66) 100%)}
.reel.bump{animation:bump .24s cubic-bezier(.3,.7,.4,1)}
@keyframes bump{35%{transform:translateY(6px)}}
.cell{position:absolute;left:0;top:0;width:200px;height:136px;display:flex;align-items:center;justify-content:center;will-change:transform}
.cell img{width:128px;height:128px;display:block;pointer-events:none;transition:transform .12s}
.reel.fast .cell img{transform:scaleY(1.16)}
.shade{position:absolute;left:0;right:0;pointer-events:none;background:rgba(18,8,4,.16);transition:background .45s}
.shade.t{top:0;height:141px}.shade.b{top:281px;bottom:0}
.window.won .shade{background:rgba(18,8,4,.64)}
.wl{position:absolute;left:0;right:0;height:8px;margin-top:-4px;pointer-events:none;background:var(--lack-hell);
  box-shadow:0 0 0 1.5px rgba(34,25,21,.85);transition:background .25s,box-shadow .25s}
.wl.t{top:143px}.wl.b{top:279px}
.window.won .wl{background:#fff3cf;box-shadow:0 0 0 1.5px rgba(120,60,10,.7),0 0 14px 4px rgba(255,214,140,.85),0 0 40px 10px rgba(255,200,110,.35);animation:wlpulse .5s steps(2,jump-none) 6}
@keyframes wlpulse{50%{background:var(--lack-hell);box-shadow:0 0 0 1.5px rgba(34,25,21,.85)}}
.ptr{position:absolute;top:183px;width:46px;height:68px;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.ptr.l{left:-30px}.ptr.r{right:-30px;transform:scaleX(-1)}
.ptr .lit{opacity:0;transition:opacity .2s}
.window.won .ptr .lit{opacity:1;animation:ptrblink .5s steps(2,jump-none) 6}
@keyframes ptrblink{50%{opacity:0}}
.glass{position:absolute;left:14px;top:14px;width:644px;height:422px;border-radius:9px;pointer-events:none;overflow:hidden;
  background:linear-gradient(110deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 20%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 80%,rgba(255,255,255,.06) 100%)}
.glass::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:130px;transform:translateX(-220px) skewX(-18deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.2),rgba(255,255,255,0))}
body.ready .glass::after{animation:glint 10s ease-in-out 2s infinite}
@keyframes glint{0%,84%{transform:translateX(-220px) skewX(-18deg)}100%{transform:translateX(820px) skewX(-18deg)}}
.cell .glint{position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;overflow:hidden;opacity:0;pointer-events:none}
.cell .glint::after{content:"";position:absolute;top:-10px;bottom:-10px;left:0;width:42px;transform:translateX(-70px) skewX(-20deg);
  background:linear-gradient(90deg,rgba(255,248,225,0),rgba(255,248,225,.8),rgba(255,248,225,0))}
.cell.win img{animation:lift .62s cubic-bezier(.3,1.5,.5,1) var(--n,2) both}
.cell.win .glint{opacity:1}
.cell.win .glint::after{animation:sweep .9s ease-in-out .25s var(--n,2)}
@keyframes lift{45%{transform:scale(1.12)}}
@keyframes sweep{to{transform:translateX(140px) skewX(-20deg)}}

.msgbar{position:absolute;left:20px;right:20px;top:642px;height:50px;border-radius:9px;background:linear-gradient(180deg,#0f0605,#22100c);
  box-shadow:0 0 0 2px var(--tinte),0 0 0 4.5px #8d959b,0 0 0 6px var(--tinte),inset 0 2px 6px rgba(0,0,0,.8)}
.msg span{display:inline-block;white-space:nowrap}
.msg{position:absolute;inset:0;text-align:center;font-weight:700;font-stretch:100%;font-size:32px;line-height:50px;letter-spacing:.01em;color:#fcedc9;
  text-shadow:0 0 14px rgba(255,206,130,.45);transition:opacity .2s;white-space:nowrap;overflow:hidden}
.msg.out{opacity:0}
.msg-probe{position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;pointer-events:none;font-weight:700;font-stretch:100%;letter-spacing:.01em}

/* Gewinnplan: 1–6 Gewinne, vergriffene sichtbar markiert (5–6: schmalere Spalten, kleinere Plaketten) */
.award{position:absolute;left:0;width:672px;top:712px;height:92px;padding:6px;border-radius:12px;background:var(--chrom);
  box-shadow:0 0 0 2px var(--tinte),0 8px 16px rgba(0,0,0,.42),inset 0 1px 0 #fff}
.award-in{position:relative;display:flex;height:100%;border-radius:7px;background:linear-gradient(180deg,var(--creme-hell),var(--creme));
  box-shadow:inset 0 0 0 1.5px var(--tinte),inset 0 2px 5px rgba(60,30,10,.18)}
.aw{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.aw+.aw::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1.5px;background:rgba(138,34,39,.35)}
.aw-sy{display:flex}
.aw-sy img{width:44px;height:44px;margin:0 -2.5px}
.n4 .aw-sy img{width:40px;height:40px;margin:0 -2px}
.aw-pr{max-width:100%;padding:0 8px;text-align:center;white-space:nowrap;overflow:hidden;font-weight:800;font-stretch:108%;font-size:29px;line-height:31px;color:var(--lack);letter-spacing:.005em}
.n4 .aw-pr{font-size:25px}
.aw.two .aw-sy img{width:34px;height:34px}
.aw.two .aw-pr{line-height:1.04;font-size:19px}
.aw-pr span{display:inline-block}
.aw>*{position:relative;z-index:1}
.aw::after{content:"";position:absolute;inset:4px;z-index:0;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(75% 95% at 50% 50%,rgba(255,214,120,.95),rgba(255,226,150,.25));box-shadow:inset 0 0 0 2.5px rgba(138,34,39,.75)}
.aw.hit::after{opacity:1;animation:awhit .5s steps(2,jump-none) 6}
@keyframes awhit{50%{opacity:.25}}
/* vergriffen: Stempel über den Symbolen, Name bleibt lesbar (durchgestrichen) */
.aw.out .aw-sy{filter:grayscale(1);opacity:.32}
.aw.out .aw-pr{opacity:.6}
.aw.out .aw-pr span{text-decoration:line-through;text-decoration-thickness:2.5px}
.aw-stamp{position:absolute!important;left:50%;top:var(--sty,27px);z-index:2!important;padding:5px 10px 4px;border:3px solid var(--lack);border-radius:6px;color:var(--lack);
  font-weight:800;font-stretch:125%;font-size:17px;line-height:19px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-6deg);background:rgba(251,245,230,.9);box-shadow:inset 0 0 0 2px var(--papier),inset 0 0 0 3.5px var(--lack)}
.n4 .aw-stamp{padding:4px 7px 3px;border-width:2.5px;font-stretch:108%;font-size:16px;line-height:18px;letter-spacing:.05em;--sty:25px}
.n5 .aw-sy img{width:35px;height:35px;margin:0 -2px}
.n6 .aw-sy img{width:31px;height:31px;margin:0 -1.5px}
.n5 .aw-pr{font-size:23px;padding:0 6px}
.n6 .aw-pr{font-size:21px;padding:0 5px}
.n5 .aw.two .aw-sy img,.n6 .aw.two .aw-sy img{width:29px;height:29px}
.n5 .aw-stamp,.n6 .aw-stamp{padding:3px 5px 2px;border-width:2px;font-stretch:96%;font-size:13px;line-height:15px;letter-spacing:.03em;--sty:22px;box-shadow:inset 0 0 0 1.5px var(--papier),inset 0 0 0 2.5px var(--lack)}
.aw-none{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-stretch:112%;font-size:22px;color:var(--lack)}

/* ---------- Rechte Spalte: Hebel-Schacht ---------- */
.pull{top:181px}
.pull-lbl{font-size:18px;line-height:20px;letter-spacing:.24em;padding-left:.24em;transition:opacity .3s}
body:not(.ready) .pull-lbl{opacity:.35}
.lamp-s{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 32%,#b36a55 0%,#5a1a14 45%,#240706 100%);box-shadow:0 0 0 1.5px #1a0a08,0 1px 0 1.5px rgba(255,220,200,.12);transition:background .12s,box-shadow .12s}
.lamp-s.on{background:radial-gradient(circle at 40% 35%,#fffef6 0%,#ffeec0 35%,#f2b860 100%);box-shadow:0 0 0 1.5px #1a0a08,0 0 12px 3px rgba(255,206,120,.75)}
#knob{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;cursor:grab;touch-action:none;z-index:6;will-change:transform;
  background:radial-gradient(circle at 36% 30%,#ee9f97 0%,#cc4146 17%,#a2262c 45%,#681318 80%,#3c080b 100%);transition:filter .3s}
#knob::before{content:"";position:absolute;inset:-26px;border-radius:50%}
#knob::after{content:"";position:absolute;left:23px;top:14px;width:32px;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.88),rgba(255,255,255,0));transform:rotate(-28deg)}
#knob.grab{cursor:grabbing}
body.locked #knob{filter:grayscale(.85) brightness(.55);cursor:not-allowed}
body.locked #leverSvg .armg{filter:brightness(.7)}
#knob.nope{animation:nope .38s}
@keyframes nope{20%,60%{margin-left:-54px}40%,80%{margin-left:-42px}}
#knob:focus-visible{outline:3px solid var(--licht);outline-offset:6px}
.paytag{position:absolute;--pw:min(184px,calc(var(--side) - 44px));left:calc(100% - var(--cxl) - var(--pw) / 2);top:262px;width:var(--pw);padding:13px 8px 12px;border-radius:7px;background:var(--papier);color:var(--lack);text-align:center;z-index:7;pointer-events:none;
  box-shadow:0 0 0 2px var(--lack),0 0 0 4px var(--papier),0 0 0 5.5px var(--tinte),0 10px 18px rgba(0,0,0,.5);transform:rotate(-2deg);transform-origin:50% -10px;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.paytag b{display:block;font-weight:800;font-stretch:100%;font-size:25px;line-height:27px}
#stage.narrow .paytag b{font-size:24px;line-height:26px;font-stretch:92%}
.paytag span{display:block;font-weight:800;font-stretch:100%;font-size:20px;line-height:23px;letter-spacing:.01em;color:var(--tinte);margin-top:7px;text-wrap:balance}
#stage.narrow .paytag span{font-size:19px;font-stretch:92%}
.paytag::before{content:"";position:absolute;left:50%;top:-30px;width:2px;height:24px;margin-left:-1px;background:#e6d8b8;box-shadow:0 0 0 .5px rgba(0,0,0,.45)}
.paytag::after{content:"";position:absolute;left:50%;top:-11px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#140a08;box-shadow:0 0 0 2px #9da5ab,0 0 0 3px var(--tinte)}
body:not(.locked) .paytag{display:none}
.spinwrap{top:722px;pointer-events:auto}
.spin{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.spin .pb{position:relative;width:46px;height:46px;border-radius:50%;background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 4px 8px rgba(0,0,0,.45)}
.spin .pb::after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#f2f4f5 0%,#b9c0c5 45%,#7b838a 100%);box-shadow:0 0 0 1.5px var(--tinte),0 3px 0 #4a5055;transition:transform .08s,box-shadow .08s}
.spin:active:not(:disabled) .pb::after{transform:translateY(2px);box-shadow:0 0 0 1.5px var(--tinte),0 1px 0 #4a5055}
.spin .cap{font-size:11px;line-height:12px;letter-spacing:.2em;padding-left:.2em;opacity:.7}
.spin:disabled{cursor:default}
.spin:disabled .pb,.spin:disabled .cap{opacity:.45}

/* ---------- Verstecktes Auslösen: 1 s auf eines der Logo-Medaillons (Rückmeldung am Medaillon, siehe oben);
   stiller Ersatz ohne Rückmeldung: die Schraube oben links ---------- */
#refill,.logohit{position:absolute;z-index:20;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;outline:none}
#refill{left:0;top:30px;width:120px;height:84px}   /* Schraube oben links; in der Home-Bildschirm-App liegt die Bühne unter der Abdeckung #topcap */
/* Lage und Größe setzt layoutMarquee() (Medaillon + 6 px Rand). Über der Gewinnkarte (z 40), damit auch dort die Sperre spürbar ist;
   unter Admin (50) und PIN-Feld (60). */
.logohit{left:0;top:0;width:0;height:0;border-radius:50%;z-index:45}
#medals,#medals *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
/* „+3 Spiele“ deckt kurz das Preisschild ab (Lage und Größe setzt toast()) – das Zählwerk bleibt frei */
#toast{position:absolute;left:calc(var(--cxl) - 70px);top:500px;width:140px;height:120px;padding:0 4px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:25;pointer-events:none;white-space:nowrap;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 30%,#2a100c,#140605);box-shadow:0 0 0 2px #9da5ab,0 0 0 3.5px var(--tinte),0 0 24px 4px rgba(255,200,110,.35),0 10px 20px rgba(0,0,0,.5);
  font-weight:900;font-stretch:92%;font-size:28px;line-height:32px;color:var(--licht);text-shadow:0 0 14px rgba(255,200,110,.65);animation:toast 2.2s ease-out forwards}
@keyframes toast{0%{transform:scale(.9);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}

/* ---------- Gewinn-Gutschein ---------- */
#sleigh{position:absolute;left:0;top:0;z-index:45;pointer-events:none;will-change:transform;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#sleigh svg{display:block}
#sleigh .lg.b{opacity:0;animation:gallop .32s steps(1,end) infinite}
#sleigh .lg.a{animation:gallop .32s steps(1,end) infinite reverse}
@keyframes gallop{0%{opacity:1}50%{opacity:0}}
.spark{position:absolute;z-index:44;width:var(--sz);height:var(--sz);margin:calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2);pointer-events:none;
  background:#ffe9a6;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px rgba(255,214,120,.9));
  animation:spark 1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(26px) scale(.3) rotate(90deg)}}
#dim{position:absolute;inset:0;background:rgba(12,5,4,.7);z-index:30;opacity:0;transition:opacity .35s}
#dim.show{opacity:1}
#fx{position:absolute;left:0;top:0;height:820px;pointer-events:none;z-index:35}
#win{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center}
.ticket-wrap{position:relative;width:860px;animation:issue .75s cubic-bezier(.2,1.25,.35,1) both}
.ticket-wrap::before{content:"";position:absolute;inset:10px 6px 0;border-radius:8px;box-shadow:0 26px 70px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.4)}
@keyframes issue{0%{transform:translateY(90px) rotate(2.5deg) scale(.9);opacity:0}35%{opacity:1}100%{transform:none}}
.ticket{position:relative;display:flex;border-radius:8px;color:var(--tinte);
  background:radial-gradient(120% 140% at 30% 20%,#fdf8ec,var(--papier) 55%,#eee0c1);
  -webkit-mask:radial-gradient(circle at 276px 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 276px 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle at 276px 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 276px 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat}
.ticket::before{content:"";position:absolute;inset:12px;border:5px double rgba(138,34,39,.78);border-radius:4px;pointer-events:none}
.stub{position:relative;width:276px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-right:3px dotted rgba(138,34,39,.5);margin:24px 0;padding:10px 0}
.stub img{width:184px;height:184px}
.stub .s-lbl{font-weight:800;font-stretch:125%;font-size:14px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:var(--lack)}
.stub .s-no{font-weight:600;font-size:13px;line-height:18px;letter-spacing:.06em;color:rgba(34,25,21,.62);margin-top:-6px;text-align:center}
.stub .s-no b{display:block;font-weight:800;font-stretch:112%;font-size:22px;line-height:26px;letter-spacing:.04em;color:var(--tinte)}
.tmain{flex:1;padding:40px 48px 40px 42px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.eyebrow{font-weight:800;font-stretch:125%;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--lack)}
.t-title{font-family:var(--f-script);font-size:96px;line-height:92px;color:var(--lack);margin:6px 0 0 -4px}
.t-prize{font-weight:900;font-stretch:118%;font-size:42px;line-height:48px;letter-spacing:.005em;margin-top:2px;max-width:100%;white-space:nowrap}
.t-hint{margin:12px 0 0;font-weight:600;font-size:21px;line-height:28px;max-width:470px;color:rgba(34,25,21,.9)}
.t-row{margin-top:26px;display:flex;align-items:center;gap:22px;width:100%}
.t-ok{position:relative;height:66px;min-width:240px;padding:0 34px;border:0;border-radius:3px;cursor:pointer;background:var(--lack);color:var(--papier);
  font-weight:800;font-stretch:125%;font-size:22px;letter-spacing:.2em;text-transform:uppercase;
  box-shadow:inset 0 0 0 4px var(--lack),inset 0 0 0 5.5px rgba(246,237,219,.85);transform:rotate(-.6deg)}
.t-ok::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;opacity:.22;mix-blend-mode:screen;
  background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px) 0 0/9px 11px,radial-gradient(circle at 70% 60%,#fff 0 .8px,transparent 1.3px) 0 0/13px 7px}
.t-ok:active{transform:rotate(-.6deg) translateY(2px);filter:brightness(.92)}
.t-ok{transition:opacity .35s}
.t-ok:disabled{cursor:default;opacity:.5}.t-ok:disabled:active{transform:rotate(-.6deg);filter:none}   /* die ersten 1,5 s nach dem Erscheinen (showTicket) */
.t-ok:focus-visible{outline:3px solid var(--lack);outline-offset:6px}

  font-weight:800;font-stretch:125%;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-12deg);opacity:.62;mix-blend-mode:multiply;
  box-shadow:inset 0 0 0 2px var(--papier),inset 0 0 0 3.5px var(--lack);animation:stamp .32s cubic-bezier(.55,0,.8,.3) .55s both}
@keyframes stamp{0%{transform:scale(2.2) rotate(-4deg);opacity:0}80%{transform:scale(.97) rotate(-12deg);opacity:.72}100%{transform:rotate(-12deg);opacity:.62}}

/* ---------- PIN-Feld (alles ist auf dem Fernseher sichtbar: nur Punkte; keine Taste leuchtet oder bewegt sich.

.pin-plate{position:relative;padding:9px;border-radius:24px;background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 #fff}

/* .pin-in.pulse / .pin-dots i.pop: Rückmeldung je Tipp, gezeichnet von pinPulse()/dotPop() */

.pin-keys{display:grid;grid-template-columns:repeat(3,98px);gap:12px;justify-content:center;margin-top:12px}

  height:74px;border:0;border-radius:12px;padding:0;background:#fbf5e6;color:var(--tinte);outline:none;transform:none;filter:none;transition:none;cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--tinte),0 3px 0 rgba(34,25,21,.3);font-weight:800;font-stretch:100%;font-size:34px;line-height:74px}
.pin-keys button.sm{font-size:16px;font-stretch:104%;letter-spacing:.04em}
.pin-keys button:disabled{opacity:.4;cursor:default}
.pin-x,.pin-x:active,.pin-x:focus{position:absolute;right:-16px;top:-16px;width:56px;height:56px;border:0;border-radius:50%;padding:0;cursor:pointer;outline:none;
  background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 4px 8px rgba(0,0,0,.45);color:var(--tinte);font-size:26px;font-weight:800;line-height:56px;transform:none}

.chk.on i::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid var(--gruen);border-width:0 3.5px 3.5px 0;transform:rotate(42deg)}
.chk.on span{color:rgba(34,25,21,.55)}
/* rechts: Diagnose „Bildschirm & Gerät“, darunter Credits – die rollen bei Bedarf in sich, der Reiter selbst nicht */
.info-r{display:flex;flex-direction:column;min-height:0}
.info-r>*{flex:none}
.info-r h3 small{margin-left:6px;font-weight:600;font-stretch:100%;font-size:13px;letter-spacing:0;text-transform:none;color:rgba(34,25,21,.66)}
.ad-body table.diag{margin:0 0 12px;font-size:14px;line-height:18px}
.ad-body table.diag td{padding:3px 10px 3px 0;border-top:1px solid rgba(34,25,21,.12);white-space:normal;vertical-align:top;overflow-wrap:anywhere}
.ad-body table.diag tr:first-child td{border-top:0}
.ad-body table.diag td:first-child{width:1%;white-space:nowrap;font-weight:800}
.ad-body table.diag td.bad{color:#8a2227;font-weight:700}
.cred{flex:1 1 0;min-height:120px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;font-size:15px;line-height:21px;
  padding:10px 14px;border-radius:8px;background:#fffdf7;box-shadow:inset 0 0 0 1.5px rgba(34,25,21,.2)}
.cred h3{margin-top:10px}.cred h3:first-child{margin-top:0}
.cred ol{margin:6px 0 10px;padding-left:22px}
.cred ol.gema{font-size:14px;line-height:19px}
.cred li{margin:3px 0}
.cred .src{color:rgba(34,25,21,.62);word-break:break-all}
.cred ol.gema li.off{color:rgba(34,25,21,.55)}

/* ---------- Hochformat: Tafel "Bitte quer halten" ---------- */
#turn{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:34px;padding:40px;text-align:center;
  background:radial-gradient(70% 55% at 50% 45%,#9a2a2f 0%,var(--lack) 45%,#5a1418 100%)}
#turn::before{content:"";position:absolute;inset:18px;border-radius:22px;border:1.5px solid rgba(243,230,200,.34);box-shadow:inset 0 0 0 7px rgba(243,230,200,.16);pointer-events:none}
#turn .plate{padding:9px;border-radius:24px;background:var(--chrom);box-shadow:0 0 0 2px var(--tinte),0 16px 30px rgba(0,0,0,.45),inset 0 1px 0 #fff}
#turn .plate-in{padding:30px 46px 34px;border-radius:16px;background:linear-gradient(180deg,var(--creme-hell),var(--creme));box-shadow:inset 0 0 0 1.5px var(--tinte)}
#turn .ts{font-family:var(--f-script);font-size:64px;line-height:64px;color:var(--gruen)}
#turn .tb{margin-top:4px;font-weight:900;font-stretch:118%;font-size:46px;line-height:50px;color:var(--lack);letter-spacing:.005em}
#turn svg{width:210px;height:210px;overflow:visible}
#turn .pad{transform-origin:75px 75px;animation:turnpad 2.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes turnpad{0%,25%{transform:none}55%,100%{transform:rotate(-90deg)}}
#turn .hint{font-weight:700;font-size:18px;letter-spacing:.06em;color:var(--creme);opacity:.8}
@media (orientation: portrait){#turn{display:flex}}

@media (prefers-reduced-motion: reduce){
  #turn .pad{animation:none;transform:rotate(-90deg)}
  .bulb::before,.bulb::after,.strip,.sw::after{transition:none}
  body.ready .glass::after,.paytag,.cell.win img,.cell.win .glint::after,body.jackpot #title .t2,body.jackpot .marquee-light,body.jackpot #medals .md,
  #counter.bump,#sleigh .lg,.ticket-wrap,.stamp,.reel.bump,.window.won .wl,.aw.hit::after,.window.won .ptr .lit,body.locked .price,#toast,.btn.arm,#knob.nope,.tg.nope svg,.trk .eq i,#medals .md.nope .mdw{animation:none}
  #medals .md.nope .mdsh{opacity:.4}
}
</style>
</head>
<body>
<div id="topcap" aria-hidden="true"></div><div id="safeProbe" aria-hidden="true"></div>
<div id="stage">
  <svg id="frame" class="layer" aria-hidden="true"></svg>
  <div class="marquee-light"></div>
  <div id="bulbs" aria-hidden="true"></div>

  <svg id="title" viewBox="0 0 820 172" role="img" aria-label="Weihnachts-Jackpot">
    <defs>
      <linearGradient id="tRed" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b9423f"/><stop offset=".55" stop-color="#8f2428"/><stop offset="1" stop-color="#6c171b"/></linearGradient>
    </defs>
    <g class="t2" font-family="Archivo" font-weight="900" font-size="88" text-anchor="middle" letter-spacing="2" style="font-stretch:125%" stroke-linejoin="round">
      <text x="410" y="144" fill="none" stroke="#221915" stroke-width="13">JACKPOT</text>
      <text x="410" y="144" fill="none" stroke="#fdf6e3" stroke-width="9.5">JACKPOT</text>
      <text id="tJack" x="410" y="144" fill="url(#tRed)" stroke="#221915" stroke-width="2.6" paint-order="stroke">JACKPOT</text>
    </g>
    <g font-family="Yesteryear" font-size="53" text-anchor="middle" stroke-linejoin="round">
      <text x="398" y="90" fill="none" stroke="#fdf6e3" stroke-width="10">Weihnachts-</text>
      <text id="tWeih" x="398" y="90" fill="#1f4a36" stroke="#221915" stroke-width="1.3" paint-order="stroke">Weihnachts-</text>
    </g>
  </svg>
  <svg id="medals" class="layer" aria-hidden="true"></svg>

  <!-- linke Spalte: Zählwerk und Preis (das Logo sitzt jetzt im Marquee) -->
  <div class="col l info">
    <div class="cgroup">
      <div class="lbl eng">Spiele</div>
      <div class="counter" id="counter" role="status" aria-label="Spiele: 0">
        <div class="drums"><div class="drum lead" id="drumT"><div class="strip"></div></div><div class="drum" id="drumO"><div class="strip"></div></div></div>
      </div>
    </div>
    <div class="price" id="price"><div class="price-in"><b>1&nbsp;€</b><i></i><span id="priceN">3 Spiele</span></div></div>
  </div>
  <div class="col l switches">
    <button class="tg" id="musBtn" type="button" aria-pressed="true" aria-label="Musik an oder aus">
      <svg viewBox="0 0 52 52" aria-hidden="true"><use href="#tgl"/><g class="bat"><use href="#tglBat"/></g><circle cx="26" cy="26" r="5" fill="#c3c9cd" stroke="#221915" stroke-width="1.5"/></svg>
      <span class="cap eng"><i class="lamp"></i>Musik</span>
    </button>
    <button class="tg" id="sndBtn" type="button" aria-pressed="true" aria-label="Ton an oder aus">
      <svg viewBox="0 0 52 52" aria-hidden="true"><use href="#tgl"/><g class="bat"><use href="#tglBat"/></g><circle cx="26" cy="26" r="5" fill="#c3c9cd" stroke="#221915" stroke-width="1.5"/></svg>
      <span class="cap eng"><i class="lamp"></i>Ton</span>
    </button>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="tgChrome" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset=".45" stop-color="#a3abb1"/><stop offset=".52" stop-color="#5d656b"/><stop offset=".6" stop-color="#c3c9cd"/><stop offset="1" stop-color="#eef1f2"/></linearGradient>
      <g id="tgl"><circle cx="26" cy="26" r="24" fill="url(#tgChrome)" stroke="#221915" stroke-width="2"/><circle cx="26" cy="26" r="10" fill="#2a201b" stroke="#221915" stroke-width="1.5"/></g>
      <g id="tglBat"><path d="M22.5 26L20 7.5Q26 3 32 7.5L29.5 26Z" fill="#e8ecee" stroke="#221915" stroke-width="1.8" stroke-linejoin="round"/><path d="M23.6 23L22 9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></g>
    </defs>
  </svg>

  <!-- Mitte -->
  <div id="center">
    <div class="window" id="window">
      <div class="opening">
        <div class="reels" id="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div>
        <div class="shade t"></div><div class="shade b"></div>
        <div class="wl t"></div><div class="wl b"></div>
      </div>
      <div class="glass"></div>
      <svg class="ptr l" viewBox="0 0 46 68" aria-hidden="true">
        <path d="M3 4L42 34L3 64Z" fill="url(#ptrChrome)" stroke="#221915" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M9 16L31 34L9 52Z" fill="#8a2227" stroke="#221915" stroke-width="1.6" stroke-linejoin="round"/>
        <path class="lit" d="M9 16L31 34L9 52Z" fill="#fff0c4"/>
        <path d="M11 21L19 28" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
        <defs><linearGradient id="ptrChrome" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset=".42" stop-color="#b3babf"/><stop offset=".5" stop-color="#5d656b"/><stop offset=".6" stop-color="#d7dcdf"/><stop offset="1" stop-color="#9aa2a8"/></linearGradient></defs>
      </svg>
      <svg class="ptr r" viewBox="0 0 46 68" aria-hidden="true">
        <path d="M3 4L42 34L3 64Z" fill="url(#ptrChrome)" stroke="#221915" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M9 16L31 34L9 52Z" fill="#8a2227" stroke="#221915" stroke-width="1.6" stroke-linejoin="round"/>
        <path class="lit" d="M9 16L31 34L9 52Z" fill="#fff0c4"/>
        <path d="M11 21L19 28" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="msgbar"><div class="msg" id="msg" role="status" aria-live="polite"></div></div>
    <div class="award" aria-label="Gewinnplan"><div class="award-in" id="awRow"></div></div>
  </div>

  <!-- rechte Spalte: Hebel -->
  <div class="col r pull"><div class="pull-lbl eng">Ziehen</div></div>
  <div id="slotLamps" aria-hidden="true"></div>
  <svg id="leverSvg" class="layer" aria-hidden="true">
    <defs>
      <linearGradient id="armG" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#5d656b"/><stop offset=".22" stop-color="#eef1f2"/><stop offset=".38" stop-color="#fdfefe"/><stop offset=".55" stop-color="#a3abb1"/><stop offset=".8" stop-color="#6f777d"/><stop offset="1" stop-color="#454b50"/>
      </linearGradient>
      <radialGradient id="hubG" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#d7dcdf"/><stop offset=".75" stop-color="#7b838a"/><stop offset="1" stop-color="#4a5055"/></radialGradient>

    <g class="armg"><polygon id="arm" fill="url(#armG)" stroke="#221915" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon id="collar" fill="url(#armG)" stroke="#221915" stroke-width="1.8" stroke-linejoin="round"/></g>
    <g id="hub"></g>
  </svg>
  <div id="knob" role="button" tabindex="0" aria-label="Hebel – nach unten ziehen zum Drehen"></div>

  <div class="col r spinwrap">
    <button class="spin" id="spin" type="button" aria-label="Drehen (Leertaste)"><span class="pb"></span><span class="cap eng">Drehen</span></button>
  </div>

  <div id="logoL" class="logohit" aria-hidden="true"></div>
  <div id="logoR" class="logohit" aria-hidden="true"></div>
  <div id="refill" aria-hidden="true"></div>
  <div id="toastHost"></div>

  <div id="dim" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="ticket-wrap" id="ticketWrap">
      <div class="ticket">
        <div class="stub"><img id="winImg" alt=""><div class="s-lbl">Gutschein</div><div class="s-no" id="winNo"></div></div>
        <div class="tmain">
          <div class="eyebrow">Weihnachts-Jackpot</div>
          <div class="t-title" id="winTitle">Gewonnen!</div>
          <div class="t-prize" id="winPrize">1× Kuchen</div>
          <p class="t-hint">Zeig diesen Gutschein dem Stand-Team – dort bekommst du deinen Gewinn.</p>
          <div class="t-row"><button class="t-ok" id="winOk" type="button">Weiter</button><span class="t-meta" id="winMeta" hidden>Weiter nur durch das Team</span></div>
        </div>
      </div>
      <div class="stamp" id="stamp">Hauptgewinn</div>
    </div>
  </div>

  <div id="admin" hidden role="dialog" aria-modal="true" aria-label="Admin-Bereich">

      <div class="ad-title">Admin</div>
      <div class="ad-tabs" role="tablist" id="adTabs">

        <button class="ad-tab" role="tab" type="button" data-tab="rechner">Rechner</button>
        <button class="ad-tab" role="tab" type="button" data-tab="statistik">Statistik</button>
        <button class="ad-tab" role="tab" type="button" data-tab="ton">Ton</button>
        <button class="ad-tab" role="tab" type="button" data-tab="einstellungen">Einstellungen</button>
        <button class="ad-tab" role="tab" type="button" data-tab="infos">Infos</button>
      </div>
      <button class="ad-close" id="adClose" type="button">Schließen&nbsp;✕</button>
    </div>
    <div class="ad-body" id="adBody" role="tabpanel"></div>
  </div>

  <!-- PIN-Feld -->
  <div id="pin" hidden role="dialog" aria-modal="true" aria-label="Code-Eingabe">
    <div class="pin-plate">
      <div class="pin-in" id="pinIn">
        <div class="pin-t" id="pinT">Code</div>
        <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
        <div class="pin-st" id="pinSt"></div>
        <div class="pin-keys" id="pinKeys">
          <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
          <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
          <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
          <button type="button" data-k="clr" class="sm">Löschen</button><button type="button" data-k="0">0</button><button type="button" data-k="back" class="sm" aria-label="Letzte Ziffer löschen"><svg viewBox="0 0 40 28" width="40" height="28" aria-hidden="true" style="vertical-align:-6px"><path d="M13 3H35a3 3 0 0 1 3 3V22a3 3 0 0 1-3 3H13L2 14Z" fill="none" stroke="#221915" stroke-width="2.6" stroke-linejoin="round"/><path d="M19 9l10 10M29 9L19 19" stroke="#221915" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <button class="pin-x" id="pinX" type="button" aria-label="Schließen">✕</button>
    </div>
  </div>
</div>

<div id="turn" role="alert">
  <svg viewBox="0 0 150 150" aria-hidden="true">
    <path d="M118 30a62 62 0 0 1 14 50" fill="none" stroke="#f3e6c8" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>

    <g class="pad"><rect x="45" y="20" width="60" height="110" rx="11" fill="#d7dcdf" stroke="#221915" stroke-width="3"/>
      <rect x="51" y="27" width="48" height="96" rx="5" fill="#1c0507"/><path d="M58 40h20M58 50h30" stroke="#ffe7a8" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="75" cy="105" r="9" fill="#a2262c" stroke="#221915" stroke-width="2"/></g>

  <div class="plate"><div class="plate-in"><div class="ts">Bitte</div><div class="tb">iPad quer halten</div></div></div>

const TEST=(()=>{try{return new URLSearchParams(location.search).get('test')==='1';}catch(_){return false;}})();  // Test-Haken nur per ?test=1
if(TEST){try{const q=new URLSearchParams(location.search).get('simSat');if(q!=null)document.documentElement.style.setProperty('--sim-sat',(+q||0)+'px');}catch(_){}}   // Test: Statusleisten-Abstand vortäuschen
const PREVIEW=window.WJ_PREVIEW===true;          // Einzeldatei-Vorschau (ohne Service Worker, Musik eingebettet)

/* Deko-Zufall (Konfetti, Klang) – getrennt vom Spielzufall */
let seed=(Date.now()%2147483646)+1;
const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;};
const body=document.body,stage=$('stage');

/* ---------- Antippen, das auf dem iPad sicher ankommt ----------
   Safari verwirft „click“, wenn der Finger beim Tippen etwas rutscht oder ein zweiter Finger aufliegt – dann wirkte ein
   Knopf manchmal „taub“. onTap löst deshalb beim Loslassen auf dem Knopf aus (bis 24 px Wackeln, 12 px neben dem Rand
   erlaubt; Wischen/Rollen bricht ab). Der „click“ danach wird geschluckt (swallowClick), damit nichts doppelt auslöst und
   kein „Geister-Klick“ auf einem gerade erst geöffneten Fenster landet. „click“ ohne Finger (Tastatur, Bedienungshilfen) wirkt weiter. */
let clickBlock=0,blockUntilUp=0;const PTR=new Set();   // PTR: Finger, die gerade aufliegen
/* Den nächsten „click“ verwerfen: bis 450 ms ab jetzt bzw. – liegt noch ein Finger auf – bis 350 ms nach dem Loslassen */
function swallowClick(){const t=performance.now();clickBlock=t+450;if(PTR.size)blockUntilUp=t+4000;}
addEventListener('pointerdown',e=>{PTR.add(e.pointerId);},true);
['pointerup','pointercancel'].forEach(n=>addEventListener(n,e=>{PTR.delete(e.pointerId);
  if(!PTR.size&&blockUntilUp){blockUntilUp=0;clickBlock=Math.max(clickBlock,performance.now()+350);}},true));
addEventListener('click',e=>{const t=performance.now();if(t<clickBlock||t<blockUntilUp){clickBlock=0;blockUntilUp=0;e.stopPropagation();e.preventDefault();}},true);
function onTap(root,sel,fn){
  let cur=null;
  root.addEventListener('pointerdown',e=>{
    if(e.button>0)return;const t=e.target.closest(sel);if(!t||!root.contains(t))return;
    cur={id:e.pointerId,t,x:e.clientX,y:e.clientY};
  });
  root.addEventListener('pointerup',e=>{
    if(!cur||e.pointerId!==cur.id)return;const c=cur;cur=null;
    if(Math.hypot(e.clientX-c.x,e.clientY-c.y)>24||!c.t.isConnected)return;
    const r=c.t.getBoundingClientRect(),m=12;
    if(e.clientX<r.left-m||e.clientX>r.right+m||e.clientY<r.top-m||e.clientY>r.bottom+m)return;
    swallowClick();fn(c.t,e);
  });
  root.addEventListener('pointercancel',e=>{if(cur&&e.pointerId===cur.id)cur=null;});
  root.addEventListener('click',e=>{const t=e.target.closest(sel);if(t&&root.contains(t))fn(t,e);});   // Tastatur, Bedienungshilfen
}

/* Spielzufall: crypto.getRandomValues (gepuffert), Ersatz Math.random */
const rand=(()=>{
  try{const c=window.crypto;if(c&&typeof c.getRandomValues==='function'){const buf=new Uint32Array(512);c.getRandomValues(buf);let i=512;
    return()=>{if(i>=512){c.getRandomValues(buf);i=0;}return buf[i++]/4294967296;};}}catch(_){}
  return Math.random;
})();

/* ---------- Speicher: jede Lese-/Schreiboperation abgesichert; App läuft auch ohne ---------- */
const store={ok:true,
  get(k){try{const s=localStorage.getItem(k);return s==null?null:JSON.parse(s);}catch(_){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));this.ok=true;return true;}catch(_){this.ok=false;return false;}}};
try{localStorage.setItem('wj.probe','1');localStorage.removeItem('wj.probe');}catch(_){store.ok=false;}

  if(!old&&o.calc&&typeof o.calc==='object'){s.calc.euros=Math.round(num(o.calc.euros,0,100000,100));
    if(Array.isArray(o.calc.k))s.calc.k=s.calc.k.map((v,i)=>Math.round(num(o.calc.k[i],0,100000,v)));}

/* ---------- Statistik ---------- */
function emptyStats(){return{since:Date.now(),games:0,releases:0,credited:0,wins:Array(NSYM).fill(0),vals:Array(NSYM).fill(0),valueOut:0,log:[]};}

/* ---------- Laufzustand: Guthaben, Gutschein-Nr. (läuft dauerhaft hoch), offener Gewinn, Sperre ---------- */
/* Code-Sperre nach 3 Fehlversuchen, stufenweise: 1 min; erneute Sperre innerhalb von 30 min nach dem Ende der letzten → 5 min; danach 15 min.
   lockLvl = Stufe der letzten Sperre (0–2). Während der Sperre bleibt das Team handlungsfähig: Die stille Schraube öffnet das
   PIN-Feld trotzdem, nimmt dort aber nur die Admin-PIN an (hebt Sperre und Stufe auf). Fehlversuche dort zählen getrennt
   (aWrong) und sperren diesen Weg höchstens 1 Minute (aLockUntil) – das Team ist also nie länger als 1 Minute ausgesperrt. */
const LOCK_MIN=[1,5,15],LOCK_RESET=30*60000,ALOCK_MS=60000;
function sanitizeState(o){
  const g={credits:0,voucher:0,pending:null,lockUntil:0,lockLvl:0,wrong:0,wrongAt:0,aWrong:0,aWrongAt:0,aLockUntil:0};if(!o||typeof o!=='object')return g;
  g.credits=Math.round(num(o.credits,0,99,0));g.voucher=Math.round(num(o.voucher,0,1e9,0));
  g.lockUntil=num(o.lockUntil,0,1e15,0);g.lockLvl=Math.round(num(o.lockLvl,0,LOCK_MIN.length-1,0));
  g.wrong=Math.round(num(o.wrong,0,3,0));g.wrongAt=num(o.wrongAt,0,1e15,0);
  g.aWrong=Math.round(num(o.aWrong,0,3,0));g.aWrongAt=num(o.aWrongAt,0,1e15,0);g.aLockUntil=num(o.aLockUntil,0,1e15,0);
  const p=o.pending;if(p&&typeof p==='object'&&Number.isFinite(+p.no)&&Number.isFinite(+p.sym))
    g.pending={no:+p.no,t:num(p.t,0,1e15,Date.now()),sym:clamp(Math.round(+p.sym),0,NSYM-1),name:String(p.name||'').slice(0,NAME_MAX),value:num(p.value,0,1e6,0),tier:TIERS_ALL.includes(p.tier)?p.tier:'klein'};
  return g;
}

/* ---------- Gewinnlogik ---------- */
const winSyms=()=>S.prizes.map((p,i)=>p.win?i:-1).filter(i=>i>=0);
/* Effektive Chance in %: Die Bänder liegen in Symbolreihenfolge hintereinander und enden bei 100 %.
   Ist die Summe über 100 %, wird das Band, das über 100 % hinausreicht, gekürzt; Bänder dahinter fallen nie. */
function effP(i){
  let used=0;
  for(let j=0;j<NSYM;j++){const p=S.prizes[j];if(!p.win)continue;const pp=Math.max(0,p.p);if(j===i)return Math.max(0,Math.min(pp,100-used));used+=pp;}
  return 0;
}
const inStock=i=>isFree(i)||S.prizes[i].n>0;   // Gutschein-Preise: Bestand zählt bei jedem Gewinn herunter, bei 0 vergriffen
const canFall=i=>{const p=S.prizes[i];return p.win&&p.active&&inStock(i)&&effP(i)>0;};
const activeWins=()=>winSyms().filter(canFall);
const activePrizes=()=>activeWins().filter(i=>!isFree(i));   // Gutschein-Preise, die fallen können
const allGone=()=>activePrizes().length===0;   // kein Gutschein-Preis mehr möglich → Maschine sperrt (Freispiele allein halten sie nicht offen)
/* Ergebnis ziehen: Bänder in Symbolreihenfolge; ein deaktivierter Preis behält sein Band und wird so zur Niete (keine Umverteilung). */
function drawSym(r){
  let x=r*100;
  for(let i=0;i<NSYM;i++){const p=S.prizes[i];if(!p.win)continue;const pp=p.p>0?p.p:0;if(x<pp)return p.active&&inStock(i)?i:-1;x-=pp;}
  return -1;
}
/* Walzenbild: Füllsymbole zufällig gemischt (Gewinnsymbole etwas seltener auf dem Band), Nebenreihen nie drei Gleiche,
   auch keine drei Gleichen auf einer Diagonale (sonst „Ich hatte doch drei Kuchen!“).
   Auf den Walzen stehen die 7 Grundsymbole und jedes Gewinnsymbol (Zusatzsymbole nur, solange ein Preis sie nutzt).
   Damit die Walzen nicht fast nur aus Gewinn-Plaketten bestehen, gibt es immer mindestens MIN_PLAIN schlichte Nieten-Bilder:
   Liegen viele Gewinne auf Grundsymbolen (z. B. 6 Gewinne auf Kuchen … Schneemann), kommen ungenutzte Zusatzsymbole als Niete dazu. */
const MIN_PLAIN=4;
let FW={w:[],sum:1,last:BASE_SYMS-1,on:[]};
function reelSyms(){
  const on=S.prizes.map((p,i)=>i<BASE_SYMS||p.win);
  let plain=S.prizes.filter((p,i)=>on[i]&&!p.win).length;
  for(let i=BASE_SYMS;i<NSYM&&plain<MIN_PLAIN;i++)if(!on[i]&&!isFree(i)){on[i]=true;plain++;}   // der Weihnachtsmann nie als Niete
  return on;
}
const onReel=i=>!!FW.on[i];
function fillerWeights(){const on=reelSyms(),w=S.prizes.map((p,i)=>!on[i]?0:p.win?1:1.5);FW={w,on,sum:w.reduce((a,b)=>a+b,0),last:w.reduce((l,x,i)=>x>0?i:l,0)};}
function filler(){let r=rand()*FW.sum;for(let i=0;i<NSYM;i++){if(r<FW.w[i])return i;r-=FW.w[i];}return FW.last;}
function noTriple(){let a;do{a=[filler(),filler(),filler()];}while(a[0]===a[1]&&a[1]===a[2]);return a;}
const tri=(a,b,c)=>a===b&&b===c;
const rowsOk=(t,m,b)=>[0,1,2].every(i=>t[i]!==m[i]&&b[i]!==m[i])&&!tri(t[0],m[1],b[2])&&!tri(b[0],m[1],t[2]);
function makeRows(mid){
  let r=null;
  for(let k=0;k<5000;k++){const m=mid||noTriple(),t=noTriple(),b=noTriple();r=[t,m,b];if(rowsOk(t,m,b))return r;}
  return r;   // praktisch unerreichbar (jeder Versuch gelingt mit über 50 %)
}
let forced;   // nur Testmodus: nächstes Ergebnis vorgeben
function drawRaw(){const sym=drawSym(rand());return{sym,rows:makeRows(sym>=0?[sym,sym,sym]:null)};}
function draw(){   // Ergebnis wird VOR dem Dreh gezogen
  if(TEST&&forced!==undefined){const sym=forced;forced=undefined;return{sym,rows:makeRows(sym>=0?[sym,sym,sym]:null)};}
  return drawRaw();
}

/* ---------- Automatik: Chancen aus Bestand, Warenwert und erwarteten Einnahmen ----------
   Ziel: Der Bestand reicht im Mittel genau bis zu den erwarteten Einnahmen S.plan.
   Warenwert je € (ev) = Restbestandswert ÷ noch erwartete Einnahmen (S.plan − bisher eingenommen, mindestens 20 % von S.plan).
   Jedes Gutschein-Stück bekommt dieselbe Chance c (pᵢ = c · Bestandᵢ), c so gewählt, dass ev = Spiele je € · Σ pᵢ·Wertᵢ,
   Spiele je € = g / (1 − m·f) mit Freispielen (Chance f, m Spiele je Freispiel). Teure Preise mit wenig Bestand fallen dadurch
   selten, billige mit viel Bestand oft; alle Bestände gehen im Mittel gleichzeitig zu Ende. Vor jedem Spiel neu gerechnet:
   Kommen mehr Leute als erwartet, gehen die Preise früher aus; bleibt gegen Ende Bestand übrig, steigen die Chancen. */
const restPlan=()=>Math.max(S.plan-ST.releases,S.plan*.2);
const targetEv=()=>stockValue()/restPlan();
function freeRate(){const fp=S.prizes[FREE];return fp.win&&fp.active?Math.min(.3,Math.max(0,fp.p)/100):0;}
const spinsPerEuro=()=>S.gamesPerEuro/(1-Math.min(.9,S.freeN*freeRate()));
function autoP(){
  if(!S.auto)return;
  const ws=winSyms().filter(i=>!isFree(i)),stockVal=ws.reduce((a,i)=>a+(S.prizes[i].active?S.prizes[i].n*S.prizes[i].value:0),0);
  let c=stockVal>0?targetEv()/(spinsPerEuro()*stockVal):0;
  const tot=ws.reduce((a,i)=>a+(S.prizes[i].active?S.prizes[i].n:0),0)*c,room=Math.max(0,1-freeRate());
  if(tot>room)c*=room/tot;   // mehr als 100 % ginge nicht – dann Ziel nicht erreichbar (Admin warnt)
  ws.forEach(i=>{const p=S.prizes[i];p.p=p.active?Math.round(c*p.n*1e6)/1e4:0;});
}
const stockValue=()=>winSyms().filter(i=>!isFree(i)&&S.prizes[i].active).reduce((a,i)=>a+S.prizes[i].n*S.prizes[i].value,0);
autoP();   // beim Start: Chancen aus gespeichertem Bestand

/* ---------- Rechner ---------- */
function calcModel(euros,k,gpe){
  /* Freispiele: Jedes Spiel bringt mit Chance f ein weiteres → im Mittel 1/(1−f) Spiele je bezahltem Spiel.
     Mit diesen Spielen insgesamt rechnet der Vorschlag; „pro Euro“ zählt alle Spiele, die ein Euro im Mittel bringt. */
  const f=canFall(FREE)?Math.min(.9,effP(FREE)/100):0,g=gpe/(1-Math.min(.9,S.freeN*f));
  const games=Math.max(0,euros)*g;
  const rows=winSyms().filter(i=>!isFree(i)).map(i=>{const pr=S.prizes[i],ki=Math.max(0,k[i]||0),pSug=games>0?ki/games:0,pCur=canFall(i)?effP(i)/100:0;
    return{i,name:pr.name,value:pr.value,k:ki,pSug,pCur,expSug:pSug*games,expCur:pCur*games,active:pr.active};});
  const agg=key=>{const p=rows.reduce((a,r)=>a+r[key],0),E=rows.reduce((a,r)=>a+r[key]*r.value,0);
    return{p,E,perEuro:g*E,margin:1-g*E,atLeast1:1-Math.pow(1-Math.min(1,p),g)};};
  return{games,rows,free:f,gpeEff:g,sug:agg('pSug'),cur:agg('pCur')};
}

const NF={};
const nf=d=>NF[d]||(NF[d]=new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}));
const fmtN=(x,d=0)=>nf(d).format(Number.isFinite(x)?x:0);
const fmtPct=(x,d=1)=>fmtN(x*100,d)+' %';
const fmtEur=(x,d=2)=>fmtN(x,d)+' €';
/* Eingaben deutsch lesen. Ganzzahl-Felder (Einnahmen, Kontingente): Punkte sind Tausendertrenner („1.200“ = 1200).
   Dezimal-Felder (Wert, Chance; höchstens 100): Komma ist Dezimalzeichen; ohne Komma gilt auch ein Punkt als Dezimalzeichen („2.5“). */
function parseNum(s,int){
  s=String(s==null?'':s).trim().replace(/[\s\u00a0\u202f€%]/g,'');if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(int)s=s.replace(/\./g,'');
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)?Number(s):NaN;
}

function voiceFor(tier){

/* ---------- Musik: Playlist der eingeschalteten Stücke (Admin → Ton), 3 s Überlappung, Endlosschleife ----------
   Startstück zufällig, danach in Listenreihenfolge; dasselbe Stück direkt hintereinander nur, wenn es das einzige ist.
   Speicherschonend: dekodiert wird nur das laufende und (kurz vor dem Wechsel) das nächste Stück; ein verklungenes
   Stück (M.prev) wird vor dem Laden des nächsten freigegeben. */
const M={on:false,cur:null,prev:null,timer:0,gen:0,err:0,status:'aus',played:0,skip:false,failAt:-1e9};
function playList(){const l=PL.filter(ti=>TRACKS[ti]&&trackOn(TRACKS[ti]));return l.length?l:PL.slice();}   // keins verfügbar an: alle verfügbaren
function nextAfter(ti,l=playList()){for(const x of l)if(x>ti)return x;return l[0];}
const pickStart=()=>{const l=playList();return l[Math.floor(rnd()*l.length)];};
async function trackBuf(ti){
  let ab;
  if(PREVIEW){ab=b64buf('mus-'+ti,true);if(!ab)throw new Error('fehlt');}
  else{const r=await fetch('music/'+TRACKS[ti].f);if(!r.ok)throw new Error('HTTP '+r.status);ab=await r.arrayBuffer();}
  return decode(ab);
}
async function loadFrom(ti){ // ab Stück ti (in Playlist-Reihenfolge) das erste ladbare
  const l=playList();let k=l.indexOf(ti);if(k<0)k=0;
  for(let n=0;n<l.length;n++){const x=l[(k+n)%l.length];try{return{ti:x,buf:await trackBuf(x)};}catch(e){M.err++;}}
  return null;
}
const loadNext=ti=>loadFrom(nextAfter(ti));
/* Was ist gerade zu hören? (Der Nachfolger wird bis zu 20 s vor dem Wechsel geplant und ist dann schon M.cur.) */
function nowPlaying(){
  if(!A.ctx)return null;const now=A.ctx.currentTime;
  if(M.cur&&M.cur.t<=now+.05)return M.cur;
  if(M.prev&&M.prev.end>now)return M.prev;
  return M.cur;
}
function musicStart(){
  if(!A.ctx||!A.unlocked||M.on)return;
  if(M.status==='fehler'&&performance.now()-M.failAt<20000)return;   // nach einem Ladefehler nicht bei jedem Tippen neu laden
  M.on=true;M.status='lädt';const gen=++M.gen;
  loadFrom(pickStart()).then(r=>{if(gen!==M.gen)return;if(!r){M.status='fehler';M.failAt=performance.now();M.on=false;return;}startTrack(r.buf,r.ti,A.ctx.currentTime+.05,1.2,gen);});
  musicTo(AUD.music?0:musicLevel(),2.5);
}
function startTrack(buf,ti,when,fade,gen){
  const t=Math.max(when,A.ctx.currentTime+.03);
  const s=A.ctx.createBufferSource(),g=A.ctx.createGain();s.buffer=buf;s.connect(g);g.connect(A.mus);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+fade);s.start(t);
  const cur={s,g,t,end:t+buf.duration,ti};M.prev=M.cur;M.cur=cur;M.status='spielt';M.played++;
  armNext(cur,gen);
}
function armNext(cur,gen){ // Wechsel 20 s vor dem Ende vorbereiten; Ersatz, falls das nicht rechtzeitig klappt: nach dem Ende
  cur.s.onended=()=>{
    if(gen!==M.gen||M.cur!==cur||cur.loading)return;   // lädt scheduleNext gerade: das startet das nächste Stück
    loadNext(cur.ti).then(r=>{if(gen!==M.gen||M.cur!==cur||!r)return;startTrack(r.buf,r.ti,A.ctx.currentTime+.05,.8,gen);});};
  clearTimeout(M.timer);
  M.timer=setTimeout(()=>scheduleNext(gen,cur),Math.max(0,(cur.end-XO-20-A.ctx.currentTime)*1000));
}
const freePrev=()=>{if(M.prev&&M.prev!==M.cur&&A.ctx&&M.prev.end<=A.ctx.currentTime)M.prev=null;};   // verklungen: Puffer freigeben
/* Stück ab t in sec ausblenden und stoppen (hat es noch nicht begonnen: gar nicht erst spielen) */
function fadeStop(c,t,sec){
  if(!c)return;c.s.onended=null;const g=c.g.gain;
  try{
    if(c.t>=t){g.cancelScheduledValues(0);g.setValueAtTime(0,A.ctx.currentTime);c.s.stop(t);return;}
    if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(t);else{g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);}
    g.linearRampToValueAtTime(0,t+sec);c.s.stop(t+sec+.05);

}
async function scheduleNext(gen,cur){

  if(gen!==M.gen||M.cur!==cur||!r)return;
  cur.s.onended=null;   // das laufende Stück klingt mit seiner eigenen Ausblendung aus und endet von selbst
  startTrack(r.buf,r.ti,Math.max(A.ctx.currentTime+.05,cur.end-XO),XIN,gen);
}
/* „Nächstes Stück“ (Admin) und Ausschalten des laufenden Stücks: kurz überblenden zum nächsten eingeschalteten.
   Ergebnis: true = gewechselt, false = nicht möglich, null = läuft schon ein Wechsel */
async function musicSkip(){
  if(M.skip)return null;
  if(!A.ctx||!M.on)return false;
  const p=nowPlaying();if(!p)return false;
  M.skip=true;const gen=++M.gen;clearTimeout(M.timer);
  try{
    const r=await loadNext(p.ti);

    const t=A.ctx.currentTime+.05;
    fadeStop(M.cur,t,XS);if(M.prev&&M.prev!==M.cur)fadeStop(M.prev,t,XS);
    startTrack(r.buf,r.ti,t,XS,gen);M.prev=null;

/* Nach dem Ein-/Ausschalten eines Stücks: Läuft gerade ein ausgeschaltetes, sofort weiter; ist schon ein Nachfolger
   geplant, der nicht mehr passt, wird er durch den richtigen ersetzt (gleicher Überblendpunkt). */
function musicReplan(){
  if(!A.ctx||!M.on||M.skip)return;
  const p=nowPlaying();if(!p)return;
  if(!playList().includes(p.ti)){musicSkip();return;}
  const c=M.cur;
  if(c&&c!==p&&c.t>A.ctx.currentTime&&c.ti!==nextAfter(p.ti)){
    const gen=++M.gen;clearTimeout(M.timer);fadeStop(c,c.t,0);M.cur=p;M.prev=null;
    loadNext(p.ti).then(r=>{if(gen!==M.gen||M.cur!==p||!r)return;startTrack(r.buf,r.ti,Math.max(A.ctx.currentTime+.05,p.end-XO),XIN,gen);});
  }
}

/* ---------- Vorhören im Admin (Effekte, Gewinn-Mischung, einzelne Musikstücke) ---------- */
const AUD={src:null,key:'',timer:0,music:false,onend:null,onfail:null};
function audStop(){audHalt();if(AUD.onend)AUD.onend();}
function audHalt(){
  clearTimeout(AUD.timer);

  if(AUD.key==='spin')loopStop(.05);

}

  unlock();if(!A.ctx)return;
  audHalt();AUD.key=key;
  const done=sec=>{clearTimeout(AUD.timer);AUD.timer=setTimeout(audStop,sec*1000+150);};
  if(key.startsWith('mus:')){
    const ti=+key.slice(4);AUD.music=true;musicTo(0,.5);
    A.prev.gain.value=Math.max(.1,S.musicVol)*MUSIC_MAX;

  done(A.buf[key]?A.buf[key].duration:1);

const H=820,WIN_W=672,EDGE=34;

/* ---------- Rand oben: ruhige Gehäuse-Abdeckung unter der iPad-Statusleiste ----------
   Als Home-Bildschirm-App liegt die Seite unter der Statusleiste (Uhrzeit, Akku); iPadOS 26/27 legt dort zusätzlich eine
   Unschärfe über die Oberkante. Die Seite kann beides nicht abschalten. Deshalb deckt #topcap (einfarbig, im HTML von Anfang an
   da, siehe index.html) diesen Streifen ab, und die Maschine wird vollständig darunter eingepasst – nichts wird angeschnitten
   oder verwischt. Automatisch: Home-Bildschirm-App → Statusleiste (gemeldete safe-area, mind. 24 px, wenn die Seite bis ganz
   oben reicht) + 16 px für die Unschärfe; liegt die Seite unter einer festen Statusleiste: 16 px. Safari-Tab, Desktop und
   Tests: 0 (Bild unverändert). Ein fester Wert im Admin (Einstellungen → Rand oben) geht vor. Unabhängig vom Vollbild,
   damit die Maschine beim Wechsel nicht springt. Mit Abdeckung trägt das Gehäuse oben eine Chromleiste (buildFrame):
   Die dunkle Abdeckung wirkt so wie der Deckel hinter der Zierleiste statt wie ein aufgesetzter Balken. */
let TOPCAP={T:0,sat:0,home:false,under:false,scrMin:0,fixed:null};
let HOME=null;   // einmal beim Start bestimmt (Vollbild per Fullscreen-API ändert display-mode, nicht aber die Art des Starts)
function homeApp(){
  if(HOME!=null)return HOME;
  if(TEST&&new URLSearchParams(location.search).get('simStandalone')==='1')return HOME=true;   // Test: Home-Bildschirm-App vortäuschen
  let mm=false;try{mm=!fsEl()&&matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches;}catch(_){}
  return HOME=navigator.standalone===true||mm;
}
function topCap(){
  const pr=$('safeProbe'),cap=$('topcap');
  const sat=pr?Math.round(pr.getBoundingClientRect().height):0,home=homeApp();
  const scrMin=Math.min(screen.width||0,screen.height||0),under=sat>0||(scrMin>0&&(innerHeight||0)>=scrMin-2);   // Seite reicht bis unter die Statusleiste
  const fixed=typeof S.topEdge==='number'?S.topEdge:null;

  T=clamp(Math.round(T),0,80);

  const vw=innerWidth||1180,TOP=topCap(),vh=(innerHeight||820)-TOP;

  const ae=document.activeElement;if(W&&vw===lastVW&&ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  lastVW=vw;

  scale=Math.max(vw/w,vh/H)*1.002;   // 0,2 % Überstand: keine angeschnittene helle Pixelspalte an der Bildkante
  stage.style.transform=`translate(-50%,-50%) scale(${scale})`;stage.style.top=TOP?f2(TOP+vh/2)+'px':'';   // ohne Rand: top 50 % wie bisher

    W=w;frameCap=TOP>0;SIDE=(W-WIN_W)/2;CXL=Math.round((EDGE+SIDE-12)/2);CXR=W-CXL;   // Mitte der Seitenfelder (Zierlinien EDGE+4 … SIDE-16)
    stage.style.width=W+'px';stage.style.setProperty('--side',SIDE+'px');stage.classList.toggle('narrow',SIDE<240);stage.style.setProperty('--cxl',CXL+'px');
    // Zählwerk: rechts mindestens 12 px Luft zum Gewinnlinien-Zeiger (Zeiger ragt 30 px links aus dem Walzenfenster)

const bulbs=[];
function placeBulbs(){
  const box=$('bulbs');box.innerHTML='';bulbs.length=0;
  const d=25,x0=X0+d,x1=W-X0-d,rx=(W-2*X0)/2-d,ry=RY-d,cx=W/2,pts=[];
  for(let y=150;y>YA;y-=2)pts.push([x0,y]);
  for(let i=0;i<=600;i++){const t=Math.PI+i/600*Math.PI;pts.push([cx+rx*Math.cos(t),YA+ry*Math.sin(t)]);}
  for(let y=YA;y<=150;y+=2)pts.push([x1,y]);
  const acc=[0];for(let i=1;i<pts.length;i++)acc.push(acc[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=acc[acc.length-1],n=Math.round(total/44)+1;let j=0;
  for(let k=0;k<n;k++){const dd=k/(n-1)*total;while(j<acc.length-1&&acc[j+1]<dd)j++;const p=pts[j];
    const el=document.createElement('i');el.className='bulb';el.style.left=f2(p[0])+'px';el.style.top=f2(p[1])+'px';el._x=p[0];el._y=p[1];box.appendChild(el);bulbs.push(el);}
}
let lightMode='idle',lightT0=performance.now();
function setLights(m){if(m!==lightMode){lightMode=m;lightT0=performance.now();}}
function lightTick(){
  const now=performance.now(),el=now-lightT0,n=bulbs.length;
  bulbs.forEach((b,i)=>{let lit;
    if(reduce){lit=lightMode!=='locked'&&lightMode!=='off';}
    else switch(lightMode){
      case 'spin':lit=mod(i-Math.floor(el/60),4)===0;break;
      case 'tease':lit=mod(i-Math.floor(el/38),3)===0;break;
      case 'gross':lit=el<2800?(Math.floor(el/150)+i)%2===0:mod(i*7+Math.floor(el/120),5)!==0;break;
      case 'mittel':lit=el<2000?(Math.floor(el/210)+i)%2===0:true;break;
      case 'klein':lit=el<1600?Math.floor(el/250)%2===0:true;break;
      case 'off':lit=false;break;
      case 'locked':{const p=mod(Math.floor(el/420),n);lit=i===p||i===n-1-p;break;}
      case 'attract':{const s=Math.floor(el/55);lit=mod(i-s,n)<3||mod(-i-s,n)<3||(Math.floor(el/2600)%2===1&&(Math.floor(el/300)+i)%2===0);break;}
      default:{const s=Math.floor(el/190);lit=mod(i-s,10)>2;}
    }
    if(b._lit!==lit){b._lit=lit;b.classList.toggle('on',lit);}
  });
}
